<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Χονδρική ρεύματος Ευρώπης: 30 € στη Γερμανία, 296 € στην Αλβανία</title>
<desc id="d">Στην προημερήσια αγορά για το Σάββατο 24 Οκτωβρίου, η Γερμανία είχε 30 ευρώ/MWh και η Αλβανία 296. Η Ελλάδα περίπου 230 ευρώ.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="493" y="60" width="294" height="50" rx="25" fill="#5727A3"/><text x="521" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="238" lengthAdjust="spacingAndGlyphs">ΧΟΝΔΡΙΚΗ ΕΥΡΩΠΗΣ</text><text x="294" y="245" font-size="90" font-weight="700" fill="#5727A3" textLength="693" lengthAdjust="spacingAndGlyphs">30 € έως 296 €</text><text x="269" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="742" lengthAdjust="spacingAndGlyphs">ανά MWh, τιμές χονδρικής για το Σάββατο 24/10</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="361" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="158" lengthAdjust="spacingAndGlyphs">~230 €</text><text x="383" y="478" font-size="32" font-weight="800" fill="#111111" textLength="115" lengthAdjust="spacingAndGlyphs">Ελλάδα</text><text x="275" y="520" font-size="20" font-weight="400" fill="#4A4A46" textLength="330" lengthAdjust="spacingAndGlyphs">μέγιστη 343 €, ελάχιστη 0,01 €</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="774" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="132" lengthAdjust="spacingAndGlyphs">39,7%</text><text x="725" y="478" font-size="32" font-weight="800" fill="#111111" textLength="230" lengthAdjust="spacingAndGlyphs">Φυσικό αέριο</text><text x="702" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="277" lengthAdjust="spacingAndGlyphs">στο μείγμα, ΑΠΕ 39,9%</text><text x="352" y="600" font-size="30" font-weight="700" fill="#111111" textLength="577" lengthAdjust="spacingAndGlyphs">η Ευρώπη χωρίζεται σε δύο ταχύτητες</text>
</svg>
