<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Νομοσχέδιο ΥΠΕΝ: μείωση 50% στις ΥΚΩ και συμβόλαια σταθερής τιμής</title>
<desc id="d">Μείωση 50% στη χρέωση ΥΚΩ για τους οικιακούς στην πρώτη κλίμακα κατανάλωσης και υποχρέωση των προμηθευτών να προσφέρουν σταθερή τιμή για τουλάχιστον ένα έτος. Το νομοσχέδιο είναι σε διαβούλευση έως 24 Οκτωβρίου.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="482" y="60" width="316" height="50" rx="25" fill="#5727A3"/><text x="510" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="260" lengthAdjust="spacingAndGlyphs">ΝΟΜΟΣΧΕΔΙΟ ΥΠΕΝ</text><text x="330" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="620" lengthAdjust="spacingAndGlyphs">−50% ΥΚΩ</text><text x="320" y="305" font-size="32" font-weight="400" fill="#4A4A46" textLength="640" lengthAdjust="spacingAndGlyphs">στην πρώτη κλίμακα κατανάλωσης, οικιακοί</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="325" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="230" lengthAdjust="spacingAndGlyphs">≥ 1 έτος</text><text x="315" y="478" font-size="32" font-weight="800" fill="#111111" textLength="250" lengthAdjust="spacingAndGlyphs">Σταθερή τιμή</text><text x="290" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="300" lengthAdjust="spacingAndGlyphs">προσφορά από κάθε προμηθευτή</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="710" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="260" lengthAdjust="spacingAndGlyphs">έως 24/10</text><text x="725" y="478" font-size="32" font-weight="800" fill="#111111" textLength="230" lengthAdjust="spacingAndGlyphs">Διαβούλευση</text><text x="705" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="270" lengthAdjust="spacingAndGlyphs">δεν έχει ψηφιστεί ακόμα</text><text x="360" y="600" font-size="30" font-weight="700" fill="#111111" textLength="560" lengthAdjust="spacingAndGlyphs">προς το παρόν είναι πρόταση, όχι νόμος</text>
</svg>
