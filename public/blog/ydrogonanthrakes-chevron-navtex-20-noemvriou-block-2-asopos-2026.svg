<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Υδρογονάνθρακες: έρευνες Chevron–HELLENiQ</title>
<desc id="d">Σεισμικές έρευνες από 20/11 και γεώτρηση στο μπλοκ 2 τον Απρίλιο του 2027.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="523" y="60" width="235" height="50" rx="25" fill="#5727A3"/><text x="550" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="179" lengthAdjust="spacingAndGlyphs">ΦΥΣΙΚΟ ΑΕΡΙΟ</text><text x="280" y="245" font-size="109" font-weight="700" fill="#5727A3" textLength="720" lengthAdjust="spacingAndGlyphs">20 Νοεμβρίου</text><text x="310" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="660" lengthAdjust="spacingAndGlyphs">έναρξη σεισμικών ερευνών, κατά αίτημα NAVTEX</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="404" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="73" lengthAdjust="spacingAndGlyphs">16%</text><text x="270" y="478" font-size="30" font-weight="800" fill="#111111" textLength="340" lengthAdjust="spacingAndGlyphs">Πιθανότητα επιτυχίας</text><text x="270" y="520" font-size="23" font-weight="400" fill="#4A4A46" textLength="340" lengthAdjust="spacingAndGlyphs">γεώτρηση «Ασωπός 1», εκτίμηση</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="682" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="315" lengthAdjust="spacingAndGlyphs">Απρίλιος 2027</text><text x="670" y="478" font-size="30" font-weight="800" fill="#111111" textLength="340" lengthAdjust="spacingAndGlyphs">Γεώτρηση στο μπλοκ 2</text><text x="670" y="520" font-size="20" font-weight="400" fill="#4A4A46" textLength="340" lengthAdjust="spacingAndGlyphs">κατά τον τελευταίο προγραμματισμό</text><text x="408" y="600" font-size="30" font-weight="700" fill="#111111" textLength="465" lengthAdjust="spacingAndGlyphs">πηγή: energygame.gr, 19/11/2026</text>
