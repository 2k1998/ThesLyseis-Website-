<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Χονδρική ρεύματος 218 ευρώ ανά μεγαβατώρα και έξοδος από τα πράσινα τιμολόγια</title>
<desc id="d">Η χονδρική τιμή ρεύματος ανέβηκε στα 218,04 ευρώ/MWh από 159,18 την προηγούμενη ημέρα. Πάνω από 280.000 οικιακοί μετρητές έφυγαν από τα πράσινα τιμολόγια μεταξύ Ιανουαρίου και Ιουλίου.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="486" y="60" width="309" height="50" rx="25" fill="#5727A3"/><text x="514" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="253" lengthAdjust="spacingAndGlyphs">ΧΟΝΔΙΚΗ ΡΕΥΜΑΤΟΣ</text><text x="278" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="725" lengthAdjust="spacingAndGlyphs">218 €/MWh</text><text x="504" y="305" font-size="32" font-weight="400" fill="#4A4A46" textLength="272" lengthAdjust="spacingAndGlyphs">+37% σε μία ημέρα</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="335" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="211" lengthAdjust="spacingAndGlyphs">−281.000</text><text x="283" y="478" font-size="32" font-weight="800" fill="#111111" textLength="315" lengthAdjust="spacingAndGlyphs">Πράσινα τιμολόγια</text><text x="290" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="300" lengthAdjust="spacingAndGlyphs">μετρητές, Ιαν – Ιουλ 2026</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="722" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="237" lengthAdjust="spacingAndGlyphs">159 → 218</text><text x="794" y="478" font-size="32" font-weight="800" fill="#111111" textLength="92" lengthAdjust="spacingAndGlyphs">€/MWh</text><text x="732" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="216" lengthAdjust="spacingAndGlyphs">από χθες σε σήμερα</text><text x="439" y="600" font-size="30" font-weight="700" fill="#111111" textLength="403" lengthAdjust="spacingAndGlyphs">ΔΕΗ: 71,27% των μετρητών</text>
</svg>
