<title id="t">Μπαταρίες 4,7 GW: 640 έργα στις λίστες του ΥΠΕΝ</title>
<desc id="d">Υπερκάλυψη στην πρόσκληση για αυτόνομες μπαταρίες. Οι όροι σύνδεσης αναμένονται σε 4 έως 8 μήνες.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
