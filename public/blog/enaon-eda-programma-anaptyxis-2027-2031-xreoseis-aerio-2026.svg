<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">ENAON EDA: πρόγραμμα ανάπτυξης 2027-2031 και χρέωση δικτύου 19,86 ευρώ ανά μεγαβατώρα</title>
<desc id="d">Σε διαβούλευση το πενταετές πρόγραμμα ανάπτυξης της ENAON EDA. Χρέωση δικτύου 19,8614 ευρώ ανά μεγαβατώρα για οικιακούς και εμπορικούς πελάτες, από 18,5849 στο προηγούμενο πρόγραμμα. Περίπου 345.000 νέοι πελάτες έως το 2031.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="510" y="60" width="261" height="50" rx="25" fill="#5727A3"/>
<text x="538" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="205" lengthAdjust="spacingAndGlyphs">ΔΙΚΤΥΟ ΑΕΡΙΟΥ</text><text x="252" y="245" font-size="114" font-weight="700" fill="#5727A3" textLength="777" lengthAdjust="spacingAndGlyphs">19,86 €/MWh</text><text x="280" y="305" font-size="32" font-weight="400" fill="#4A4A46" textLength="720" lengthAdjust="spacingAndGlyphs">χρέωση δικτύου αερίου, οικιακοί και εμπορικοί</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="374" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="132" lengthAdjust="spacingAndGlyphs">+6,9%</text><text x="284" y="478" font-size="30" font-weight="800" fill="#111111" textLength="313" lengthAdjust="spacingAndGlyphs">Από το προηγούμενο</text><text x="326" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="228" lengthAdjust="spacingAndGlyphs">18,58 → 19,86 €/MWh</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="735" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="211" lengthAdjust="spacingAndGlyphs">~345.000</text><text x="682" y="478" font-size="26" font-weight="800" fill="#111111" textLength="316" lengthAdjust="spacingAndGlyphs">Νέοι πελάτες έως 2031</text><text x="687" y="520" font-size="18" font-weight="400" fill="#4A4A46" textLength="306" lengthAdjust="spacingAndGlyphs">Αττική, Θεσσαλονίκη, Θεσσαλία κ.ά.</text><text x="321" y="600" font-size="30" font-weight="700" fill="#111111" textLength="638" lengthAdjust="spacingAndGlyphs">σε διαβούλευση στη ΡΑΑΕΥ, όχι οριστικό</text>
</svg>
