<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Metlen και Shell: δεσμευτική συμφωνία για 6 φορτία LNG τον χρόνο</title>
<desc id="d">Η Metlen και η Shell Global LNG υπέγραψαν δεσμευτική συμφωνία πενταετούς προμήθειας LNG, περίπου 0,6 δισ. κυβικά μέτρα ετησίως, με έναρξη το 2027.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="478" y="60" width="324" height="50" rx="25" fill="#5727A3"/><text x="506" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="268" lengthAdjust="spacingAndGlyphs">ΦΥΣΙΚΟ ΑΕΡΙΟ · LNG</text><text x="354" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="572" lengthAdjust="spacingAndGlyphs">6 φορτία</text><text x="340" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="600" lengthAdjust="spacingAndGlyphs">LNG τον χρόνο, Metlen – Shell Global LNG</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="307" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="266" lengthAdjust="spacingAndGlyphs">0,6 δισ. m³</text><text x="368" y="478" font-size="32" font-weight="800" fill="#111111" textLength="143" lengthAdjust="spacingAndGlyphs">Ανά έτος</text><text x="270" y="520" font-size="20" font-weight="400" fill="#4A4A46" textLength="340" lengthAdjust="spacingAndGlyphs">περίπου, σύμφωνα με την ανακοίνωση</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="780" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="121" lengthAdjust="spacingAndGlyphs">5 έτη</text><text x="768" y="478" font-size="32" font-weight="800" fill="#111111" textLength="143" lengthAdjust="spacingAndGlyphs">Διάρκεια</text><text x="756" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="168" lengthAdjust="spacingAndGlyphs">έναρξη το 2027</text><text x="272" y="600" font-size="30" font-weight="700" fill="#111111" textLength="735" lengthAdjust="spacingAndGlyphs">κυρίως από το χαρτοφυλάκιο LNG της Shell στις ΗΠΑ</text>
</svg>
