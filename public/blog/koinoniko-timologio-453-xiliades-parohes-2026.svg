<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Κοινωνικό Οικιακό Τιμολόγιο: 453.688 παροχές τον Ιούλιο 2026</title>
<desc id="d">Σύμφωνα με στοιχεία της ΡΑΑΕΥ, η ΔΕΗ έχει το 71,55% των παροχών ΚΟΤ, η Protergia το 6,95% και η ΖeniΘ το 5,57%.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="471" y="60" width="338" height="50" rx="25" fill="#5727A3"/><text x="499" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="282" lengthAdjust="spacingAndGlyphs">ΚΟΙΝΩΝΙΚΟ ΤΙΜΟΛΟΓΙΟ</text><text x="390" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="500" lengthAdjust="spacingAndGlyphs">453.688</text><text x="262" y="305" font-size="26" font-weight="400" fill="#4A4A46" textLength="757" lengthAdjust="spacingAndGlyphs">παροχές στο Κοινωνικό Οικιακό Τιμολόγιο, Ιούλιος 2026</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="361" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="158" lengthAdjust="spacingAndGlyphs">71,55%</text><text x="412" y="478" font-size="32" font-weight="800" fill="#111111" textLength="57" lengthAdjust="spacingAndGlyphs">ΔΕΗ</text><text x="308" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="264" lengthAdjust="spacingAndGlyphs">324.596 μετρητές ΚΟΤ</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="774" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="132" lengthAdjust="spacingAndGlyphs">6,95%</text><text x="754" y="478" font-size="32" font-weight="800" fill="#111111" textLength="172" lengthAdjust="spacingAndGlyphs">Protergia</text><text x="715" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="250" lengthAdjust="spacingAndGlyphs">31.528 μετρητές ΚΟΤ</text><text x="297" y="600" font-size="24" font-weight="700" fill="#111111" textLength="686" lengthAdjust="spacingAndGlyphs">ΔΕΗ, Protergia και ΖeniΘ έχουν τα μεγαλύτερα μερίδια</text>
</svg>
