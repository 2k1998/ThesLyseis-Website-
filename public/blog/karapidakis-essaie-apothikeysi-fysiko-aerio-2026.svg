<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Καραπιδάκης (ΕΣΣΑΗΕ): αναγκαία η αποθήκευση για να περιοριστεί ο ρόλος του φυσικού αερίου</title>
<desc id="d">Ο γενικός διευθυντής του ΕΣΣΑΗΕ είπε ότι η αποθήκευση είναι αναγκαίο συμπλήρωμα των ΑΠΕ και πρέπει να αντιμετωπίζεται ως flexibility asset.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="471" y="60" width="339" height="50" rx="25" fill="#5727A3"/><text x="498" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="283" lengthAdjust="spacingAndGlyphs">ΕΣΣΑΗΕ · ΑΠΟΘΗΚΕΥΣΗ</text><text x="282" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="715" lengthAdjust="spacingAndGlyphs">Αποθήκευση</text><text x="325" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="630" lengthAdjust="spacingAndGlyphs">«Αν δεν γίνει, θα υπάρχει το φυσικό αέριο»</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="270" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="339" lengthAdjust="spacingAndGlyphs">Μεγάλα spreads</text><text x="270" y="478" font-size="25" font-weight="800" fill="#111111" textLength="340" lengthAdjust="spacingAndGlyphs">Βιώσιμη στα πρώτα βήματα</text><text x="270" y="520" font-size="20" font-weight="400" fill="#4A4A46" textLength="340" lengthAdjust="spacingAndGlyphs">έσοδα από DAM και άλλες υπηρεσίες</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="670" y="425" font-size="36" font-weight="800" fill="#5727A3" textLength="340" lengthAdjust="spacingAndGlyphs">flexibility asset</text><text x="742" y="478" font-size="32" font-weight="800" fill="#111111" textLength="197" lengthAdjust="spacingAndGlyphs">Ο ρόλος της</text><text x="670" y="520" font-size="20" font-weight="400" fill="#4A4A46" textLength="340" lengthAdjust="spacingAndGlyphs">όχι μια ακόμη τεχνολογία παραγωγής</text><text x="295" y="600" font-size="30" font-weight="700" fill="#111111" textLength="690" lengthAdjust="spacingAndGlyphs">Μανώλης Καραπιδάκης, γενικός διευθυντής ΕΣΣΑΗΕ</text>
</svg>
