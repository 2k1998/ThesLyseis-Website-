<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Χονδρική 190 €/MWh τον Οκτώβριο και στροφή των καταναλωτών στα μπλε τιμολόγια</title>
<desc id="d">Η μέση χονδρική του Οκτωβρίου είναι 190 ευρώ/MWh από 156 τον Σεπτέμβριο. Για 300 kWh τον μήνα, το σταθερό κοστίζει περίπου 67 ευρώ και το πράσινο 77.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="493" y="60" width="294" height="50" rx="25" fill="#5727A3"/><text x="521" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="238" lengthAdjust="spacingAndGlyphs">ΜΠΛΕ ΚΑΙ ΠΡΑΣΙΝΑ</text><text x="319" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="643" lengthAdjust="spacingAndGlyphs">190 €/MWh</text><text x="263" y="305" font-size="28" font-weight="400" fill="#4A4A46" textLength="754" lengthAdjust="spacingAndGlyphs">μέση χονδρική Οκτωβρίου, από 156 € τον Σεπτέμβριο</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="388" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="105" lengthAdjust="spacingAndGlyphs">67 €</text><text x="306" y="478" font-size="32" font-weight="800" fill="#111111" textLength="268" lengthAdjust="spacingAndGlyphs">Σταθερό (μπλε)</text><text x="335" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="211" lengthAdjust="spacingAndGlyphs">300 kWh τον μήνα</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="788" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="105" lengthAdjust="spacingAndGlyphs">77 €</text><text x="773" y="478" font-size="32" font-weight="800" fill="#111111" textLength="134" lengthAdjust="spacingAndGlyphs">Πράσινο</text><text x="735" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="211" lengthAdjust="spacingAndGlyphs">300 kWh τον μήνα</text><text x="335" y="600" font-size="30" font-weight="700" fill="#111111" textLength="610" lengthAdjust="spacingAndGlyphs">οι καταναλωτές στρέφονται στα σταθερά</text>
</svg>
