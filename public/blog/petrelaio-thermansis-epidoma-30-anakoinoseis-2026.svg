<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Πετρέλαιο θέρμανσης: επίδομα +30% και σενάρια επιδότησης στην αντλία</title>
<desc id="d">Το επίδομα θέρμανσης αυξάνεται 30%, με ελάχιστο 130 και μέγιστο 1.040 ευρώ. Σενάρια για τιμή εκκίνησης 1,41 έως 1,71 ευρώ το λίτρο. Οι ανακοινώσεις αναμένονται σήμερα.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="462" y="60" width="356" height="50" rx="25" fill="#5727A3"/>
<text x="490" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="300" lengthAdjust="spacingAndGlyphs">ΠΕΤΡΕΛΑΙΟ ΘΕΡΜΑΝΣΗΣ</text><text x="479" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="322" lengthAdjust="spacingAndGlyphs">+30%</text><text x="416" y="305" font-size="32" font-weight="400" fill="#4A4A46" textLength="448" lengthAdjust="spacingAndGlyphs">αύξηση στο επίδομα θέρμανσης</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="295" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="290" lengthAdjust="spacingAndGlyphs">130–1.040 €</text><text x="329" y="478" font-size="32" font-weight="800" fill="#111111" textLength="222" lengthAdjust="spacingAndGlyphs">Επίδομα 2026</text><text x="338" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="204" lengthAdjust="spacingAndGlyphs">πέρυσι: 100–800 €</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="695" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="290" lengthAdjust="spacingAndGlyphs">1,41–1,71 €</text><text x="711" y="478" font-size="32" font-weight="800" fill="#111111" textLength="259" lengthAdjust="spacingAndGlyphs">Τιμή εκκίνησης</text><text x="738" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="204" lengthAdjust="spacingAndGlyphs">σενάρια ανά λίτρο</text><text x="271" y="600" font-size="24" font-weight="700" fill="#111111" textLength="739" lengthAdjust="spacingAndGlyphs">η επιδότηση στην αντλία: σενάριο μέχρι τις ανακοινώσεις</text>
</svg>
