<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Χονδρική ρεύματος 287,75 €/MWh: νέο άλμα 20,5% και πίεση στα πράσινα του Νοεμβρίου</title>
<desc id="d">Η χονδρική τιμή του ρεύματος ανέβηκε 20,5% στα 287,75 ευρώ/MWh από 238,8 στις 29 Οκτωβρίου. Ο μέσος όρος του Οκτωβρίου είναι 194,28, +24,3% από τον Σεπτέμβριο.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="486" y="60" width="308" height="50" rx="25" fill="#5727A3"/><text x="514" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="252" lengthAdjust="spacingAndGlyphs">ΧΟΝΔΡΙΚΗ ΡΕΥΜΑΤΟΣ</text><text x="354" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="572" lengthAdjust="spacingAndGlyphs">287,75 €</text><text x="385" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="511" lengthAdjust="spacingAndGlyphs">ανά MWh, Παρασκευή 30 Οκτωβρίου</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="361" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="158" lengthAdjust="spacingAndGlyphs">+20,5%</text><text x="325" y="478" font-size="32" font-weight="800" fill="#111111" textLength="230" lengthAdjust="spacingAndGlyphs">Σε μία ημέρα</text><text x="295" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="290" lengthAdjust="spacingAndGlyphs">από 238,8 € στις 29/10</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="735" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="211" lengthAdjust="spacingAndGlyphs">194,28 €</text><text x="696" y="478" font-size="32" font-weight="800" fill="#111111" textLength="288" lengthAdjust="spacingAndGlyphs">Μέσος όρος Οκτ.</text><text x="675" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="330" lengthAdjust="spacingAndGlyphs">+24,3% από τον Σεπτέμβριο</text><text x="327" y="600" font-size="30" font-weight="700" fill="#111111" textLength="627" lengthAdjust="spacingAndGlyphs">τα νέα τιμολόγια ανακοινώνονται την 1η</text>
</svg>
