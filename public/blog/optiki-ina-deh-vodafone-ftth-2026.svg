<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Οπτική ίνα: η «μάχη» των παρόχων και η συμφωνία ΔΕΗ-Vodafone</title>
<desc id="d">Η ΔΕΗ και η Vodafone έχουν μη δεσμευτική συμφωνία για κοινό χονδρικό δίκτυο οπτικής ίνας. Οι ενεργές συνδέσεις FTTH ήταν 1.231.339 στο τέλος Ιουνίου 2026, σύμφωνα με την ΕΕΤΤ.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="538" y="60" width="204" height="50" rx="25" fill="#5727A3"/><text x="566" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="148" lengthAdjust="spacingAndGlyphs">ΟΠΤΙΚΗ ΙΝΑ</text><text x="294" y="245" font-size="90" font-weight="700" fill="#5727A3" textLength="693" lengthAdjust="spacingAndGlyphs">ΔΕΗ + Vodafone</text><text x="269" y="305" font-size="26" font-weight="400" fill="#4A4A46" textLength="743" lengthAdjust="spacingAndGlyphs">μη δεσμευτική συμφωνία για κοινό δίκτυο οπτικής ίνας</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="322" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="237" lengthAdjust="spacingAndGlyphs">2,3 εκατ.</text><text x="316" y="478" font-size="32" font-weight="800" fill="#111111" textLength="249" lengthAdjust="spacingAndGlyphs">ΔΕΗ FiberGrid</text><text x="277" y="520" font-size="22" font-weight="400" fill="#4A4A46" textLength="326" lengthAdjust="spacingAndGlyphs">νοικοκυριά και επιχειρήσεις</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="708" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="264" lengthAdjust="spacingAndGlyphs">1,23 εκατ.</text><text x="725" y="478" font-size="32" font-weight="800" fill="#111111" textLength="230" lengthAdjust="spacingAndGlyphs">Ενεργές FTTH</text><text x="682" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="316" lengthAdjust="spacingAndGlyphs">ΕΕΤΤ, τέλος Ιουνίου 2026</text><text x="297" y="600" font-size="25" font-weight="700" fill="#111111" textLength="687" lengthAdjust="spacingAndGlyphs">οριστική συμφωνία αναμένεται έως το τέλος του 2026</text>
</svg>
