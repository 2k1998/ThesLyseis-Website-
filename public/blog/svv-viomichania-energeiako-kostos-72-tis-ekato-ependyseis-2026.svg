<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">ΣΒΕ: 72% των επιχειρήσεων διστάζουν να επενδύσουν λόγω ενεργειακού κόστους</title>
<desc id="d">Σύμφωνα με τον ΣΒΕ, η Ελλάδα έχει τη χειρότερη επίδοση μεταξύ 24 χωρών στο ενεργειακό κόστος της βιομηχανίας: 72% των επιχειρήσεων διστάζουν να επενδύσουν, έναντι 37% στην ΕΕ.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="456" y="60" width="368" height="50" rx="25" fill="#5727A3"/><text x="484" y="94" font-size="23" font-weight="700" fill="#FFFFFF" textLength="312" lengthAdjust="spacingAndGlyphs">ΒΙΟΜΗΧΑΝΙΑ · ΕΝΕΡΓΕΙΑ</text><text x="532" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="215" lengthAdjust="spacingAndGlyphs">72%</text><text x="290" y="305" font-size="25" font-weight="400" fill="#4A4A46" textLength="700" lengthAdjust="spacingAndGlyphs">των επιχειρήσεων διστάζουν να επενδύσουν λόγω ενέργειας</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="404" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="73" lengthAdjust="spacingAndGlyphs">37%</text><text x="324" y="478" font-size="32" font-weight="800" fill="#111111" textLength="233" lengthAdjust="spacingAndGlyphs">Μέσος όρος ΕΕ</text><text x="270" y="520" font-size="20" font-weight="400" fill="#4A4A46" textLength="340" lengthAdjust="spacingAndGlyphs">το αντίστοιχο ποσοστό στην Ευρώπη</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="743" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="194" lengthAdjust="spacingAndGlyphs">24 χώρες</text><text x="678" y="478" font-size="32" font-weight="800" fill="#111111" textLength="323" lengthAdjust="spacingAndGlyphs">Η Ελλάδα τελευταία</text><text x="670" y="520" font-size="20" font-weight="400" fill="#4A4A46" textLength="340" lengthAdjust="spacingAndGlyphs">στο ενεργειακό κόστος βιομηχανίας</text><text x="302" y="600" font-size="30" font-weight="700" fill="#111111" textLength="675" lengthAdjust="spacingAndGlyphs">ΣΒΕ, συνέδριο ΙΕΝΕ «Ενέργεια &amp; Ανάπτυξη 2026»</text>
</svg>
