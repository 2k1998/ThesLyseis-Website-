<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Σχέδιο στήριξης για τον χειμώνα: οι ημερομηνίες που αναμένονται</title>
<desc id="d">Επιδοτήσεις καυσίμων στις 2 και 16 Νοεμβρίου, πληρωμές άνω του 1,1 δισ. ευρώ στις 30 Νοεμβρίου και επίδομα θέρμανσης στις 23 Δεκεμβρίου, σύμφωνα με το ertnews.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="501" y="60" width="279" height="50" rx="25" fill="#5727A3"/><text x="529" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="223" lengthAdjust="spacingAndGlyphs">ΣΧΕΔΙΟ ΣΤΗΡΙΞΗΣ</text><text x="291" y="245" font-size="127" font-weight="700" fill="#5727A3" textLength="698" lengthAdjust="spacingAndGlyphs">1,1 δισ. €</text><text x="275" y="305" font-size="19" font-weight="400" fill="#4A4A46" textLength="731" lengthAdjust="spacingAndGlyphs">αναμένονται στις 30 Νοεμβρίου (επιστροφή ενοικίου και έκτακτο επίδομα)</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="308" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="264" lengthAdjust="spacingAndGlyphs">2 &amp; 16 Νοε</text><text x="373" y="478" font-size="32" font-weight="800" fill="#111111" textLength="134" lengthAdjust="spacingAndGlyphs">Καύσιμα</text><text x="271" y="520" font-size="22" font-weight="400" fill="#4A4A46" textLength="338" lengthAdjust="spacingAndGlyphs">νέες επιδοτήσεις αναμένονται</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="761" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="158" lengthAdjust="spacingAndGlyphs">23 Δεκ</text><text x="677" y="478" font-size="32" font-weight="800" fill="#111111" textLength="326" lengthAdjust="spacingAndGlyphs">Επίδομα θέρμανσης</text><text x="695" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="290" lengthAdjust="spacingAndGlyphs">προβλέπεται αύξηση 30%</text><text x="310" y="600" font-size="30" font-weight="700" fill="#111111" textLength="660" lengthAdjust="spacingAndGlyphs">προγραμματισμός, όχι οριστικές αποφάσεις</text>
</svg>
