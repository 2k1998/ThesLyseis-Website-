<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Γιατί τα σταθερά είναι φθηνότερα από τα κυμαινόμενα;</title>
<desc id="d">Άρθρο γνώμης του Γιάννη Τριήρη στο iEnergeia: προτείνει πλαφόν στο περιθώριο κέρδους και αλλαγές στο μοντέλο χονδρικής.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="575" y="60" width="130" height="50" rx="25" fill="#5727A3"/><text x="603" y="94" font-size="23" font-weight="700" fill="#FFFFFF" textLength="74" lengthAdjust="spacingAndGlyphs">ΑΠΟΨΗ</text><text x="280" y="245" font-size="100" font-weight="700" fill="#5727A3" textLength="720" lengthAdjust="spacingAndGlyphs">11,5–13 λεπτά</text><text x="325" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="630" lengthAdjust="spacingAndGlyphs">η κλειδωμένη τιμή που αναφέρει ο συντάκτης</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="392" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="97" lengthAdjust="spacingAndGlyphs">ΜΠΛΕ</text><text x="288" y="478" font-size="32" font-weight="800" fill="#111111" textLength="305" lengthAdjust="spacingAndGlyphs">Σταθερά τιμολόγια</text><text x="272" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="336" lengthAdjust="spacingAndGlyphs">φθηνότερα από τα κυμαινόμενα</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="756" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="169" lengthAdjust="spacingAndGlyphs">ΠΡΑΣΙΝΑ</text><text x="742" y="478" font-size="32" font-weight="800" fill="#111111" textLength="197" lengthAdjust="spacingAndGlyphs">Κυμαινόμενα</text><text x="670" y="520" font-size="23" font-weight="400" fill="#4A4A46" textLength="340" lengthAdjust="spacingAndGlyphs">ακριβότερα, κατά τον συντάκτη</text><text x="340" y="600" font-size="30" font-weight="700" fill="#111111" textLength="600" lengthAdjust="spacingAndGlyphs">προσωπική άποψη του συντάκτη, όχι είδηση</text>
</svg>
