<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Συμβούλιο Υπουργών Ενέργειας ΕΕ: τι συζητείται ενώ το αέριο αγγίζει τα 100 €/MWh</title>
<desc id="d">Το φυσικό αέριο άγγιξε τα 100 ευρώ/MWh για πρώτη φορά από τον Δεκέμβριο του 2022. Οι υπουργοί ενέργειας συζητούν τιμολόγια δικτύου και ενεργειακή ασφάλεια. Η βιομηχανία ζητά πλαφόν 1,2 ευρώ/MWh στις χρεώσεις δικτύων.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="404" y="60" width="472" height="50" rx="25" fill="#5727A3"/><text x="432" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="416" lengthAdjust="spacingAndGlyphs">ΣΥΜΒΟΥΛΙΟ ΥΠΟΥΡΓΩΝ ΕΝΕΡΓΕΙΑΣ</text><text x="319" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="643" lengthAdjust="spacingAndGlyphs">100 €/MWh</text><text x="267" y="305" font-size="23" font-weight="400" fill="#4A4A46" textLength="746" lengthAdjust="spacingAndGlyphs">το αέριο στην Ευρώπη, πρώτη φορά από τον Δεκέμβριο του 2022</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="348" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="184" lengthAdjust="spacingAndGlyphs">238,8 €</text><text x="296" y="478" font-size="32" font-weight="800" fill="#111111" textLength="288" lengthAdjust="spacingAndGlyphs">Χονδρική Ελλάδα</text><text x="302" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="277" lengthAdjust="spacingAndGlyphs">ανά MWh, σήμερα 29/10</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="774" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="132" lengthAdjust="spacingAndGlyphs">1,2 €</text><text x="706" y="478" font-size="32" font-weight="800" fill="#111111" textLength="268" lengthAdjust="spacingAndGlyphs">Πλαφόν δικτύων</text><text x="676" y="520" font-size="23" font-weight="400" fill="#4A4A46" textLength="328" lengthAdjust="spacingAndGlyphs">αίτημα βιομηχανίας ανά MWh</text><text x="343" y="600" font-size="30" font-weight="700" fill="#111111" textLength="594" lengthAdjust="spacingAndGlyphs">ατζέντα και προτάσεις, όχι αποφάσεις</text>
</svg>
