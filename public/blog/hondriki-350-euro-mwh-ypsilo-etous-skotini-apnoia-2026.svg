<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Χονδρική ρεύματος στα 350 €/MWh: νέο υψηλό έτους</title>
<desc id="d">Η μέση τιμή στην Αγορά Επόμενης Ημέρας ανέβηκε περίπου 68% σε μία ημέρα, με το αέριο να καλύπτει πάνω από το 60% της παραγωγής.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="486" y="60" width="309" height="50" rx="25" fill="#5727A3"/><text x="514" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="253" lengthAdjust="spacingAndGlyphs">ΧΟΝΔΡΙΚΗ ΡΕΥΜΑΤΟΣ</text><text x="318" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="644" lengthAdjust="spacingAndGlyphs">350 €/MWh</text><text x="370" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="540" lengthAdjust="spacingAndGlyphs">η μέση τιμή της Δευτέρας 9 Νοεμβρίου</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="368" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="145" lengthAdjust="spacingAndGlyphs">+67,6%</text><text x="288" y="478" font-size="32" font-weight="800" fill="#111111" textLength="305" lengthAdjust="spacingAndGlyphs">Άλμα σε μία ημέρα</text><text x="296" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="288" lengthAdjust="spacingAndGlyphs">από 208,82 € την Κυριακή</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="804" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="73" lengthAdjust="spacingAndGlyphs">24%</text><text x="742" y="478" font-size="32" font-weight="800" fill="#111111" textLength="197" lengthAdjust="spacingAndGlyphs">Μερίδιο ΑΠΕ</text><text x="708" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="264" lengthAdjust="spacingAndGlyphs">από 50,44% την Κυριακή</text><text x="295" y="600" font-size="30" font-weight="700" fill="#111111" textLength="690" lengthAdjust="spacingAndGlyphs">πηγές: energypress.gr, energygame.gr, dnews.gr</text>
</svg>
