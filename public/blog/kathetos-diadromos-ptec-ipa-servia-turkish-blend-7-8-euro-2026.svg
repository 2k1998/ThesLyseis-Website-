<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="523" y="60" width="235" height="50" rx="25" fill="#5727A3"/><text x="550" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="179" lengthAdjust="spacingAndGlyphs">ΦΥΣΙΚΟ ΑΕΡΙΟ</text><text x="318" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="644" lengthAdjust="spacingAndGlyphs">7–8 €/MWh</text><text x="348" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="585" lengthAdjust="spacingAndGlyphs">κόστος μεταφοράς μέσω Κάθετου Διαδρόμου</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="368" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="145" lengthAdjust="spacingAndGlyphs">1,93 €</text><text x="324" y="478" font-size="32" font-weight="800" fill="#111111" textLength="233" lengthAdjust="spacingAndGlyphs">Μέσω Πολωνίας</text><text x="308" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="264" lengthAdjust="spacingAndGlyphs">ανταγωνιστική διαδρομή</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="695" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="290" lengthAdjust="spacingAndGlyphs">15 δισ. κ.μ.</text><text x="706" y="478" font-size="32" font-weight="800" fill="#111111" textLength="269" lengthAdjust="spacingAndGlyphs">Σερβικός αγωγός</text><text x="670" y="520" font-size="22" font-weight="400" fill="#4A4A46" textLength="340" lengthAdjust="spacingAndGlyphs">δυνητικά ελεύθερη δυναμικότητα</text><text x="408" y="600" font-size="30" font-weight="700" fill="#111111" textLength="465" lengthAdjust="spacingAndGlyphs">πηγή: energygame.gr, 20/11/2026</text>
