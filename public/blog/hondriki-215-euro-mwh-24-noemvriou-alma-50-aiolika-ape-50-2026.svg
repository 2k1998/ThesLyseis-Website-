<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Χονδρική ρεύματος: άλμα 50% σε μία ημέρα</title>
<desc id="d">Λιγότερος άνεμος, κρύο και ακριβό αέριο ανεβάζουν την τιμή.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="575" y="60" width="130" height="50" rx="25" fill="#5727A3"/><text x="603" y="94" font-size="23" font-weight="700" fill="#FFFFFF" textLength="74" lengthAdjust="spacingAndGlyphs">ΡΕΥΜΑ</text><text x="280" y="245" font-size="109" font-weight="700" fill="#5727A3" textLength="720" lengthAdjust="spacingAndGlyphs">215,74 €/MWh</text><text x="445" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="390" lengthAdjust="spacingAndGlyphs">μέση τιμή χονδρικής, 24/11</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="356" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="169" lengthAdjust="spacingAndGlyphs">+49,55%</text><text x="270" y="478" font-size="31" font-weight="800" fill="#111111" textLength="340" lengthAdjust="spacingAndGlyphs">Σε σχέση με Δευτέρα</text><text x="338" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="204" lengthAdjust="spacingAndGlyphs">144,26 €/MWh χθες</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="731" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="218" lengthAdjust="spacingAndGlyphs">341 €/MWh</text><text x="670" y="478" font-size="31" font-weight="800" fill="#111111" textLength="340" lengthAdjust="spacingAndGlyphs">Μέγιστη τιμή ημέρας</text><text x="726" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="228" lengthAdjust="spacingAndGlyphs">ελάχιστη 2,01 €/MWh</text><text x="302" y="600" font-size="30" font-weight="700" fill="#111111" textLength="675" lengthAdjust="spacingAndGlyphs">πηγή: iEnergeia.gr, energygame.gr, 24/11/2026</text>
