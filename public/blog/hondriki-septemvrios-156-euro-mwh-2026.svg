<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Χονδρική ρεύματος Σεπτεμβρίου: 156 ευρώ ανά MWh</title>
<desc id="d">Η μέση τιμή προημερήσιας αγοράς τον Σεπτέμβριο ήταν 156 ευρώ ανά MWh. Μερίδια προμήθειας: ΔΕΗ 51,5%, Metlen 21,5%, ΗΡΩΝ 10,24%.</desc>
