<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Ρεύμα στα 224,57 ευρώ ανά μεγαβατώρα και αέριο στα υψηλά από το 2022</title>
<desc id="d">Η χονδρική τιμή ρεύματος ανέβηκε από 159,18 ευρώ στις 11 Οκτωβρίου σε 224,57 ευρώ στις 13 Οκτωβρίου. Το φυσικό αέριο στην Ευρώπη ξεπέρασε τα 83 ευρώ ανά μεγαβατώρα, υψηλό από τον Δεκέμβριο του 2022.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="494" y="60" width="293" height="50" rx="25" fill="#5727A3"/>
<text x="522" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="237" lengthAdjust="spacingAndGlyphs">ΡΕΥΜΑ ΚΑΙ ΑΕΡΙΟ</text><text x="254" y="245" font-size="104" font-weight="700" fill="#5727A3" textLength="773" lengthAdjust="spacingAndGlyphs">224,57 €/MWh</text><text x="392" y="305" font-size="32" font-weight="400" fill="#4A4A46" textLength="496" lengthAdjust="spacingAndGlyphs">χονδρική ρεύματος, 13 Οκτωβρίου</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="322" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="237" lengthAdjust="spacingAndGlyphs">159 → 225</text><text x="320" y="478" font-size="32" font-weight="800" fill="#111111" textLength="241" lengthAdjust="spacingAndGlyphs">Σε δύο ημέρες</text><text x="320" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="240" lengthAdjust="spacingAndGlyphs">€/MWh, 11/10 → 13/10</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="748" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="184" lengthAdjust="spacingAndGlyphs">83–84 €</text><text x="757" y="478" font-size="32" font-weight="800" fill="#111111" textLength="167" lengthAdjust="spacingAndGlyphs">Αέριο TTF</text><text x="686" y="520" font-size="22" font-weight="400" fill="#4A4A46" textLength="308" lengthAdjust="spacingAndGlyphs">υψηλό από τον Δεκέμβριο 2022</text><text x="304" y="600" font-size="30" font-weight="700" fill="#111111" textLength="672" lengthAdjust="spacingAndGlyphs">το αέριο καλύπτει το 39,9% του μείγματος</text>
</svg>
