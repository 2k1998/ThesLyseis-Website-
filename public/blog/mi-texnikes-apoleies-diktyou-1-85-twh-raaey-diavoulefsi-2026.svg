<title id="t">Απώλειες δικτύου: 1,85 TWh «μη τεχνικές» το 2025</title>
<desc id="d">Νέα μελέτη ΔΕΔΔΗΕ: οι συνολικές απώλειες στο 10,10%. Οι νέοι συντελεστές είναι σε διαβούλευση ΡΑΑΕΥ έως 27/11.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="493" y="60" width="294" height="50" rx="25" fill="#5727A3"/><text x="521" y="94" font-size="23" font-weight="700" fill="#FFFFFF" textLength="238" lengthAdjust="spacingAndGlyphs">ΑΠΩΛΕΙΕΣ ΔΙΚΤΥΟΥ</text><text x="426" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="429" lengthAdjust="spacingAndGlyphs">10,10%</text><text x="332" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="615" lengthAdjust="spacingAndGlyphs">οι συνολικές απώλειες του δικτύου το 2025</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="343" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="194" lengthAdjust="spacingAndGlyphs">1,85 TWh</text><text x="342" y="478" font-size="32" font-weight="800" fill="#111111" textLength="197" lengthAdjust="spacingAndGlyphs">Μη τεχνικές</text><text x="270" y="520" font-size="20" font-weight="400" fill="#4A4A46" textLength="340" lengthAdjust="spacingAndGlyphs">κυρίως ρευματοκλοπές και μετρητές</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="780" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="121" lengthAdjust="spacingAndGlyphs">27/11</text><text x="688" y="478" font-size="32" font-weight="800" fill="#111111" textLength="305" lengthAdjust="spacingAndGlyphs">Διαβούλευση ΡΑΑΕΥ</text><text x="684" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="312" lengthAdjust="spacingAndGlyphs">για τους νέους συντελεστές</text><text x="415" y="600" font-size="30" font-weight="700" fill="#111111" textLength="450" lengthAdjust="spacingAndGlyphs">πηγή: iEnergeia.gr, 11/11/2026</text>
