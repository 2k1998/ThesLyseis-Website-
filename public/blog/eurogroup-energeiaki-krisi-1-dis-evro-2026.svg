<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Ενεργειακή κρίση: σχέδιο περίπου 1 δισ. ευρώ έως το 2028</title>
<desc id="d">Το ελληνικό σχέδιο προβλέπει 200 εκατ. ευρώ για αντλίες θερμότητας και ηλιακούς θερμοσίφωνες, 200 εκατ. για μπαταρίες και 117 εκατ. για ενεργειακή αναβάθμιση δημόσιων κτιρίων.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="501" y="60" width="278" height="50" rx="25" fill="#5727A3"/><text x="529" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="222" lengthAdjust="spacingAndGlyphs">ΜΕΤΡΑ ΣΤΗΡΙΞΗΣ</text><text x="237" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="806" lengthAdjust="spacingAndGlyphs">≈ 1 δισ. €</text><text x="346" y="305" font-size="32" font-weight="400" fill="#4A4A46" textLength="588" lengthAdjust="spacingAndGlyphs">ενεργειακές επενδύσεις έως το 2028</text><text x="300" y="365" font-size="26" font-weight="700" fill="#111111" textLength="661" lengthAdjust="spacingAndGlyphs">Αντλίες θερμότητας &amp; ηλιακοί θερμοσίφωνες</text><rect x="300" y="379" width="520" height="36" rx="8" fill="#5727A3"/><text x="834" y="408" font-size="28" font-weight="800" fill="#5727A3" textLength="191" lengthAdjust="spacingAndGlyphs">200 εκατ. €</text><text x="300" y="465" font-size="26" font-weight="700" fill="#111111" textLength="355" lengthAdjust="spacingAndGlyphs">Μπαταρίες &amp; αποθήκευση</text><rect x="300" y="479" width="520" height="36" rx="8" fill="#5727A3"/><text x="834" y="508" font-size="28" font-weight="800" fill="#5727A3" textLength="191" lengthAdjust="spacingAndGlyphs">200 εκατ. €</text><text x="300" y="565" font-size="26" font-weight="700" fill="#111111" textLength="613" lengthAdjust="spacingAndGlyphs">Ενεργειακή αναβάθμιση δημόσιων κτιρίων</text><rect x="300" y="579" width="304" height="36" rx="8" fill="#9153F4"/><text x="618" y="608" font-size="28" font-weight="800" fill="#5727A3" textLength="191" lengthAdjust="spacingAndGlyphs">117 εκατ. €</text>
</svg>
