<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Μετά το Eurogroup: περιθώριο 400 εκατ. ευρώ για μέτρα στήριξης</title>
<desc id="d">Δημοσιονομικό περιθώριο 400 εκατ. ευρώ για πρόσθετα μέτρα ενεργειακής στήριξης: περίπου 200 εκατ. για το 2026 και 200 εκατ. για το 2027.</desc>
