<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Ρεύμα: ράλι χονδρικής παρότι το αέριο έπεσε στα 80 €</title>
<desc id="d">Οι ηλεκτροπαραγωγοί χρησιμοποιούν αέριο «κλειδωμένο» στις τιμές του Οκτωβρίου και η παραγωγή ΑΠΕ είναι χαμηλή.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="486" y="60" width="309" height="50" rx="25" fill="#5727A3"/><text x="514" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="253" lengthAdjust="spacingAndGlyphs">ΧΟΝΔΡΙΚΗ ΡΕΥΜΑΤΟΣ</text><text x="318" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="644" lengthAdjust="spacingAndGlyphs">350 €/MWh</text><text x="290" y="305" font-size="24" font-weight="400" fill="#4A4A46" textLength="700" lengthAdjust="spacingAndGlyphs">νέο υψηλό έτους στη χονδρική, ενώ το αέριο είναι στα 81 €</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="392" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="97" lengthAdjust="spacingAndGlyphs">−20%</text><text x="332" y="478" font-size="32" font-weight="800" fill="#111111" textLength="215" lengthAdjust="spacingAndGlyphs">Φυσικό αέριο</text><text x="284" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="312" lengthAdjust="spacingAndGlyphs">από τα υψηλά των 100 €/MWh</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="743" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="194" lengthAdjust="spacingAndGlyphs">95–100 €</text><text x="670" y="478" font-size="31" font-weight="800" fill="#111111" textLength="340" lengthAdjust="spacingAndGlyphs">Αέριο «month ahead»</text><text x="670" y="520" font-size="21" font-weight="400" fill="#4A4A46" textLength="340" lengthAdjust="spacingAndGlyphs">κλειδωμένο στις τιμές Οκτωβρίου</text><text x="400" y="600" font-size="30" font-weight="700" fill="#111111" textLength="480" lengthAdjust="spacingAndGlyphs">πηγή: energypress.gr, 10/11/2026</text>
</svg>
