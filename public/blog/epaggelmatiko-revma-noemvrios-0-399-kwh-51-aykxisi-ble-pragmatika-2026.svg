<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Επαγγελματικό ρεύμα Νοεμβρίου</title>
<desc id="d">Η ακριβότερη τιμή ανεβαίνει κατά 51% σε έναν χρόνο, με στοιχεία ΡΑΑΕΥ.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="575" y="60" width="130" height="50" rx="25" fill="#5727A3"/><text x="603" y="94" font-size="23" font-weight="700" fill="#FFFFFF" textLength="74" lengthAdjust="spacingAndGlyphs">ΡΕΥΜΑ</text><text x="497" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="286" lengthAdjust="spacingAndGlyphs">+51%</text><text x="415" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="450" lengthAdjust="spacingAndGlyphs">η ακριβότερη τιμή: 0,399 €/kWh</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="368" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="145" lengthAdjust="spacingAndGlyphs">+34,9%</text><text x="314" y="478" font-size="32" font-weight="800" fill="#111111" textLength="251" lengthAdjust="spacingAndGlyphs">Φθηνότερη τιμή</text><text x="374" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="132" lengthAdjust="spacingAndGlyphs">0,155 €/kWh</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="695" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="290" lengthAdjust="spacingAndGlyphs">65 € – 121 €</text><text x="670" y="478" font-size="30" font-weight="800" fill="#111111" textLength="340" lengthAdjust="spacingAndGlyphs">Μπλε έναντι πράσινων</text><text x="720" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="240" lengthAdjust="spacingAndGlyphs">μέση χρέωση, 330 kWh</text><text x="408" y="600" font-size="30" font-weight="700" fill="#111111" textLength="465" lengthAdjust="spacingAndGlyphs">πηγή: energygame.gr, 21/11/2026</text>
