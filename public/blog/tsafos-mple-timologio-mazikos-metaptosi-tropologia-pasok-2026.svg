<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Τσάφος: γιατί όχι μαζική μετάπτωση στα μπλε τιμολόγια</title>
<desc id="d">Δηλώσεις του υφυπουργού Ενέργειας στη Βουλή για την τροπολογία του ΠΑΣΟΚ. Ισχυρισμοί του υφυπουργού, όχι επιβεβαιωμένα γεγονότα.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="486" y="60" width="309" height="50" rx="25" fill="#5727A3"/><text x="514" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="253" lengthAdjust="spacingAndGlyphs">ΒΟΥΛΗ · ΤΙΜΟΛΟΓΙΑ</text><text x="354" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="572" lengthAdjust="spacingAndGlyphs">40-40-20</text><text x="290" y="305" font-size="26" font-weight="400" fill="#4A4A46" textLength="700" lengthAdjust="spacingAndGlyphs">ο υπολογισμός του υφυπουργού: πράσινα, μπλε, κίτρινα</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="331" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="218" lengthAdjust="spacingAndGlyphs">3,1 εκατ.</text><text x="270" y="478" font-size="31" font-weight="800" fill="#111111" textLength="340" lengthAdjust="spacingAndGlyphs">Παροχές στο πράσινο</text><text x="296" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="288" lengthAdjust="spacingAndGlyphs">≈50%, κατά τον υφυπουργό</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="756" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="169" lengthAdjust="spacingAndGlyphs">1 εκατ.</text><text x="670" y="478" font-size="27" font-weight="800" fill="#111111" textLength="340" lengthAdjust="spacingAndGlyphs">Με ελάχιστη κατανάλωση</text><text x="696" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="288" lengthAdjust="spacingAndGlyphs">κλειστά ή εξοχικά σπίτια</text><text x="258" y="600" font-size="30" font-weight="700" fill="#111111" textLength="765" lengthAdjust="spacingAndGlyphs">δηλώσεις του υφυπουργού, όχι επιβεβαιωμένα στοιχεία</text>
</svg>
