<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Πρόγραμμα «Απόλλων»: νέο μοντέλο για τους δήμους</title>
<desc id="d">Το ΥΠΕΝ εξετάζει πρόσκληση αντί για διαγωνισμό και χαρτοφυλάκιο 300–340 MW, με αποφάσεις έως το τέλος του έτους.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="523" y="60" width="235" height="50" rx="25" fill="#5727A3"/><text x="550" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="179" lengthAdjust="spacingAndGlyphs">ΔΗΜΟΙ · ΥΠΕΝ</text><text x="282" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="715" lengthAdjust="spacingAndGlyphs">300–340 MW</text><text x="355" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="570" lengthAdjust="spacingAndGlyphs">ένα από τα σενάρια για το χαρτοφυλάκιο</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="404" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="73" lengthAdjust="spacingAndGlyphs">332</text><text x="306" y="478" font-size="32" font-weight="800" fill="#111111" textLength="269" lengthAdjust="spacingAndGlyphs">Δήμοι της χώρας</text><text x="284" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="312" lengthAdjust="spacingAndGlyphs">≈2,3 TWh ετήσια κατανάλωση</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="707" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="266" lengthAdjust="spacingAndGlyphs">600 εκατ. €</text><text x="678" y="478" font-size="32" font-weight="800" fill="#111111" textLength="323" lengthAdjust="spacingAndGlyphs">Ήδη «κατοχυρωμένα»</text><text x="762" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="156" lengthAdjust="spacingAndGlyphs">υπέρ του ΥΠΕΝ</text><text x="370" y="600" font-size="30" font-weight="700" fill="#111111" textLength="540" lengthAdjust="spacingAndGlyphs">πληροφορίες, όχι οριστικές αποφάσεις</text>
</svg>
