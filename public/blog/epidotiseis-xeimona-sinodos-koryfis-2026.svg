<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Επιδοτήσεις χειμώνα: μέτρα στις 14 Οκτωβρίου και Σύνοδος Κορυφής 15-16 Οκτωβρίου</title>
<desc id="d">Πρώτα μέτρα ενεργειακής στήριξης αναμένονται την Τετάρτη 14 Οκτωβρίου, με στόχο το πετρέλαιο θέρμανσης κάτω από 1,75 ευρώ το λίτρο. Η Σύνοδος Κορυφής 15-16 Οκτωβρίου θα κρίνει αν θα υπάρξει πρόσθετος δημοσιονομικός χώρος.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="497" y="60" width="286" height="50" rx="25" fill="#5727A3"/><text x="525" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="230" lengthAdjust="spacingAndGlyphs">ΜΕΤΡΑ ΧΕΙΜΩΝΑ</text><text x="260" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="760" lengthAdjust="spacingAndGlyphs">14 Οκτωβρίου</text><text x="310" y="305" font-size="32" font-weight="400" fill="#4A4A46" textLength="660" lengthAdjust="spacingAndGlyphs">αναμένεται η ανακοίνωση των πρώτων μέτρων</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="345" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="190" lengthAdjust="spacingAndGlyphs">&lt; 1,75 €</text><text x="270" y="478" font-size="32" font-weight="800" fill="#111111" textLength="340" lengthAdjust="spacingAndGlyphs">Πετρέλαιο θέρμανσης</text><text x="325" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="230" lengthAdjust="spacingAndGlyphs">στόχος τιμής ανά λίτρο</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="725" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="230" lengthAdjust="spacingAndGlyphs">15–16 Οκτ.</text><text x="695" y="478" font-size="32" font-weight="800" fill="#111111" textLength="290" lengthAdjust="spacingAndGlyphs">Σύνοδος Κορυφής</text><text x="690" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="300" lengthAdjust="spacingAndGlyphs">θα κρίνει τον πρόσθετο χώρο</text><text x="355" y="600" font-size="30" font-weight="700" fill="#111111" textLength="570" lengthAdjust="spacingAndGlyphs">πρόσθετη στήριξη: δεν έχει αποφασιστεί</text>
</svg>
