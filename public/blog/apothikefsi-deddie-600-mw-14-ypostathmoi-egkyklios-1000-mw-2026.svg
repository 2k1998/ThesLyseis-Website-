<title id="t">Αποθήκευση: 600 MW και προτεραιότητα έως 1.000 MW</title>
<desc id="d">Αναβάθμιση 14 υποσταθμών του ΔΕΔΔΗΕ και εγκύκλιος του ΥΠΕΝ για αποθήκευση με φωτοβολταϊκά.</desc>
