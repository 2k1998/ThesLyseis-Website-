<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Πετρέλαιο θέρμανσης: σενάρια για επιδότηση και αύξηση επιδόματος</title>
<desc id="d">Σενάρια για τιμή εκκίνησης 1,41 έως 1,71 ευρώ το λίτρο, επιδότηση στην αντλία 25 έως 45 λεπτά και αύξηση 20% στο επίδομα θέρμανσης. Οι αποφάσεις αναμένονται την Τετάρτη 14 Οκτωβρίου.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="462" y="60" width="356" height="50" rx="25" fill="#5727A3"/><text x="490" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="300" lengthAdjust="spacingAndGlyphs">ΠΕΤΡΕΛΑΙΟ ΘΕΡΜΑΝΣΗΣ</text><text x="479" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="322" lengthAdjust="spacingAndGlyphs">+20%</text><text x="320" y="305" font-size="32" font-weight="400" fill="#4A4A46" textLength="640" lengthAdjust="spacingAndGlyphs">σενάριο αύξησης του επιδόματος θέρμανσης</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="295" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="290" lengthAdjust="spacingAndGlyphs">1,41–1,71 €</text><text x="311" y="478" font-size="32" font-weight="800" fill="#111111" textLength="259" lengthAdjust="spacingAndGlyphs">Τιμή εκκίνησης</text><text x="338" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="204" lengthAdjust="spacingAndGlyphs">σενάρια ανά λίτρο</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="695" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="290" lengthAdjust="spacingAndGlyphs">25–45 λεπτά</text><text x="683" y="478" font-size="32" font-weight="800" fill="#111111" textLength="315" lengthAdjust="spacingAndGlyphs">Επιδότηση αντλίας</text><text x="708" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="264" lengthAdjust="spacingAndGlyphs">σενάρια, όχι αποφάσεις</text><text x="380" y="600" font-size="30" font-weight="700" fill="#111111" textLength="520" lengthAdjust="spacingAndGlyphs">αποφάσεις: Τετάρτη 14 Οκτωβρίου</text>
</svg>
