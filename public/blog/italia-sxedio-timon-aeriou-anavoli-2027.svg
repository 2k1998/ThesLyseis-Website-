<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Η Ιταλία αναβάλλει κατά ένα έτος το σχέδιο για τις τιμές αερίου</title>
<desc id="d">Η πλήρης εφαρμογή μεταφέρεται στην 1η Οκτωβρίου 2027. Δοκιμές θα γίνουν τον Ιανουάριο και τον Φεβρουάριο.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="508" y="60" width="264" height="50" rx="25" fill="#5727A3"/><text x="536" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="208" lengthAdjust="spacingAndGlyphs">ΙΤΑΛΙΑ · ΑΕΡΙΟ</text><text x="319" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="643" lengthAdjust="spacingAndGlyphs">1/10/2027</text><text x="265" y="305" font-size="21" font-weight="400" fill="#4A4A46" textLength="750" lengthAdjust="spacingAndGlyphs">νέα ημερομηνία πλήρους εφαρμογής του σχεδίου για τις τιμές αερίου</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="295" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="290" lengthAdjust="spacingAndGlyphs">200 εκατ. €</text><text x="316" y="478" font-size="32" font-weight="800" fill="#111111" textLength="249" lengthAdjust="spacingAndGlyphs">Χρηματοδότηση</text><text x="302" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="277" lengthAdjust="spacingAndGlyphs">πριμοδοτήσεις έως 10%</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="748" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="184" lengthAdjust="spacingAndGlyphs">100.000</text><text x="716" y="478" font-size="32" font-weight="800" fill="#111111" textLength="249" lengthAdjust="spacingAndGlyphs">MWh ανά ημέρα</text><text x="675" y="520" font-size="20" font-weight="400" fill="#4A4A46" textLength="330" lengthAdjust="spacingAndGlyphs">μέγιστες αγορές Snam στην αρχή</text><text x="360" y="600" font-size="30" font-weight="700" fill="#111111" textLength="561" lengthAdjust="spacingAndGlyphs">τα μέτρα για το αέριο θέλουν χρόνο</text>
</svg>
