<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Χονδρική ρεύματος: από τα 350 στα 145 €/MWh</title>
<desc id="d">Η επιστροφή των ανέμων έριξε την τιμή της 13ης Νοεμβρίου, αλλά ο μέσος όρος των πρώτων 12 ημερών ξεπερνά τα 279 €/MWh.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="486" y="60" width="309" height="50" rx="25" fill="#5727A3"/><text x="514" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="253" lengthAdjust="spacingAndGlyphs">ΧΟΝΔΡΙΚΗ ΡΕΥΜΑΤΟΣ</text><text x="280" y="245" font-size="109" font-weight="700" fill="#5727A3" textLength="720" lengthAdjust="spacingAndGlyphs">144,83 €/MWh</text><text x="348" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="585" lengthAdjust="spacingAndGlyphs">η μέση τιμή της Παρασκευής 13 Νοεμβρίου</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="368" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="145" lengthAdjust="spacingAndGlyphs">−58,6%</text><text x="270" y="478" font-size="28" font-weight="800" fill="#111111" textLength="340" lengthAdjust="spacingAndGlyphs">Από το υψηλό της 9/11</text><text x="338" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="204" lengthAdjust="spacingAndGlyphs">349,98 €/MWh τότε</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="780" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="121" lengthAdjust="spacingAndGlyphs">71,3%</text><text x="714" y="478" font-size="32" font-weight="800" fill="#111111" textLength="251" lengthAdjust="spacingAndGlyphs">ΑΠΕ στο μείγμα</text><text x="720" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="240" lengthAdjust="spacingAndGlyphs">από 24,23% στις 9/11</text><text x="408" y="600" font-size="30" font-weight="700" fill="#111111" textLength="465" lengthAdjust="spacingAndGlyphs">πηγή: energygame.gr, 13/11/2026</text>
</svg>
