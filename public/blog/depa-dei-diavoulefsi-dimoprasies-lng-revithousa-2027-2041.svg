<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">ΔΕΠΑ και ΔΕΗ στη διαβούλευση της ΡΑΑΕΥ για τις δημοπρασίες LNG στη Ρεβυθούσα</title>
<desc id="d">Η ΔΕΠΑ Εμπορίας ζητά να μετατεθούν οι δημοπρασίες LNG για τα έτη 2036, 2040 και 2041 στο 2027 και η ΔΕΗ προτείνει χρονοθυρίδες τουλάχιστον 1 TWh από το 2041.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="486" y="60" width="309" height="50" rx="25" fill="#5727A3"/><text x="514" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="253" lengthAdjust="spacingAndGlyphs">ΔΙΑΒΟΥΛΕΥΣΗ ΡΑΑΕΥ</text><text x="426" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="429" lengthAdjust="spacingAndGlyphs">15 έτη</text><text x="302" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="675" lengthAdjust="spacingAndGlyphs">προγραμματισμός δημοπρασιών LNG στη Ρεβυθούσα</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="270" y="425" font-size="38" font-weight="800" fill="#5727A3" textLength="340" lengthAdjust="spacingAndGlyphs">2036, 2040, 2041</text><text x="306" y="478" font-size="32" font-weight="800" fill="#111111" textLength="269" lengthAdjust="spacingAndGlyphs">Δημοπρασίες LNG</text><text x="302" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="276" lengthAdjust="spacingAndGlyphs">ΔΕΠΑ: μεταφορά στο 2027</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="756" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="169" lengthAdjust="spacingAndGlyphs">≥ 1 TWh</text><text x="706" y="478" font-size="32" font-weight="800" fill="#111111" textLength="269" lengthAdjust="spacingAndGlyphs">Ανά χρονοθυρίδα</text><text x="702" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="276" lengthAdjust="spacingAndGlyphs">πρόταση ΔΕΗ από το 2041</text><text x="348" y="600" font-size="30" font-weight="700" fill="#111111" textLength="585" lengthAdjust="spacingAndGlyphs">προτάσεις σε διαβούλευση, όχι αποφάσεις</text>
</svg>
