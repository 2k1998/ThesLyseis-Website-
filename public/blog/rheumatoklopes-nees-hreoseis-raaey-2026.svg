<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Ρευματοκλοπές: νέες αυξημένες χρεώσεις της ΡΑΑΕΥ</title>
<desc id="d">Με απόφαση της ΡΑΑΕΥ που δημοσιεύτηκε σε ΦΕΚ, οι χρεώσεις για ρευματοκλοπή ανεβαίνουν στα 652 ευρώ/MWh για οικιακούς και 671 για μη οικιακούς.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="531" y="60" width="219" height="50" rx="25" fill="#5727A3"/><text x="559" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="163" lengthAdjust="spacingAndGlyphs">ΡΑΑΕΥ · ΦΕΚ</text><text x="319" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="643" lengthAdjust="spacingAndGlyphs">652 €/MWh</text><text x="261" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="759" lengthAdjust="spacingAndGlyphs">νέα χρέωση ρευματοκλοπής, οικιακοί (από 566 €)</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="374" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="132" lengthAdjust="spacingAndGlyphs">671 €</text><text x="335" y="478" font-size="32" font-weight="800" fill="#111111" textLength="211" lengthAdjust="spacingAndGlyphs">Μη οικιακοί</text><text x="328" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="224" lengthAdjust="spacingAndGlyphs">από 598 € ανά MWh</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="774" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="132" lengthAdjust="spacingAndGlyphs">+100%</text><text x="744" y="478" font-size="32" font-weight="800" fill="#111111" textLength="192" lengthAdjust="spacingAndGlyphs">Προσαύξηση</text><text x="689" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="303" lengthAdjust="spacingAndGlyphs">50% στις κατηγορίες ΚΟΤ</text><text x="302" y="600" font-size="30" font-weight="700" fill="#111111" textLength="676" lengthAdjust="spacingAndGlyphs">αφορά μόνο όσους διαπράττουν ρευματοκλοπή</text>
</svg>
