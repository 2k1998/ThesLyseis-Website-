<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">ΡΑΑΕΥ: κανόνες γραμμικής μεταβολής ισχύος για τους σταθμούς ΑΠΕ και χρεώσεις μη συμμόρφωσης</title>
<desc id="d">Η ΡΑΑΕΥ ενέκρινε μεθοδολογία για τις περικοπές παραγωγής ΑΠΕ: σταδιακή μεταβολή της ισχύος μέσα σε δέκα λεπτά και χρεώσεις μη συμμόρφωσης, με το ύψος να καθοριστεί αργότερα.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="530" y="60" width="220" height="50" rx="25" fill="#5727A3"/><text x="558" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="164" lengthAdjust="spacingAndGlyphs">ΡΑΑΕΥ · ΑΠΕ</text><text x="354" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="572" lengthAdjust="spacingAndGlyphs">10 λεπτά</text><text x="340" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="600" lengthAdjust="spacingAndGlyphs">σταδιακή μεταβολή ισχύος των σταθμών ΑΠΕ</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="356" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="169" lengthAdjust="spacingAndGlyphs">5 λεπτά</text><text x="342" y="478" font-size="32" font-weight="800" fill="#111111" textLength="197" lengthAdjust="spacingAndGlyphs">Έναρξη πριν</text><text x="272" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="336" lengthAdjust="spacingAndGlyphs">από κάθε περίοδο εκκαθάρισης</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="756" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="169" lengthAdjust="spacingAndGlyphs">3 μήνες</text><text x="706" y="478" font-size="32" font-weight="800" fill="#111111" textLength="269" lengthAdjust="spacingAndGlyphs">Προθεσμία ΑΔΜΗΕ</text><text x="670" y="520" font-size="23" font-weight="400" fill="#4A4A46" textLength="340" lengthAdjust="spacingAndGlyphs">για πρόταση ορίου και χρέωσης</text><text x="295" y="600" font-size="30" font-weight="700" fill="#111111" textLength="690" lengthAdjust="spacingAndGlyphs">το ύψος των χρεώσεων δεν έχει ακόμη καθοριστεί</text>
</svg>
