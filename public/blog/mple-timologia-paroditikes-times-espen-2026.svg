<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Μπλε τιμολόγια: η καλή τιμή δεν θα κρατήσει</title>
<desc id="d">Εικονογράφηση: λουκέτο σταθερής τιμής και ανοδικές στήλες. Ο ΕΣΠΕΝ εκτιμά ότι τα μπλε τιμολόγια είναι ήδη περίπου 2,5 λεπτά ακριβότερα από πέρσι.</desc>
