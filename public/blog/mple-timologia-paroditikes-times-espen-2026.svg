<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="501" y="60" width="278" height="50" rx="25" fill="#5727A3"/><text x="529" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="222" lengthAdjust="spacingAndGlyphs">ΜΠΛΕ ΤΙΜΟΛΟΓΙΑ</text><text x="340" y="200" font-size="88" font-weight="700" fill="#111111" textLength="600" lengthAdjust="spacingAndGlyphs">Η καλή τιμή</text><text x="231" y="295" font-size="88" font-weight="700" fill="#5727A3" textLength="818" lengthAdjust="spacingAndGlyphs">δεν θα κρατήσει</text><rect x="330" y="420" width="140" height="112" rx="18" fill="#5727A3"/><path d="M356 420 v-34 a44 44 0 0 1 88 0 v34" fill="none" stroke="#5727A3" stroke-width="16" stroke-linecap="round"/><circle cx="400" cy="470" r="14" fill="#FFFFFF"/><rect x="393" y="472" width="14" height="30" rx="6" fill="#FFFFFF"/><text x="288" y="585" font-size="30" font-weight="700" fill="#111111" textLength="223" lengthAdjust="spacingAndGlyphs">Σταθερή τιμή</text><rect x="610" y="470" width="60" height="70" rx="9" fill="#D6C5F0"/><rect x="696" y="430" width="60" height="110" rx="9" fill="#D6C5F0"/><rect x="782" y="390" width="60" height="150" rx="9" fill="#D6C5F0"/><rect x="868" y="340" width="60" height="200" rx="9" fill="#5727A3"/><text x="576" y="585" font-size="30" font-weight="700" fill="#5727A3" textLength="409" lengthAdjust="spacingAndGlyphs">≈ +2,5 λεπτά από πέρσι</text>
