<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Τα φθηνά μπλε τιμολόγια δεν είναι λύση για όλα τα νοικοκυριά</title>
<desc id="d">Η ΔΕΗ προσφέρει σταθερό τιμολόγιο 11,5 λεπτών ανά κιλοβατώρα, αλλά ηλικιωμένοι και όσοι δεν χρησιμοποιούν ψηφιακές υπηρεσίες δυσκολεύονται να το βρουν. Τα σταθερά ήταν το 31,44% των οικιακών παροχών τον Ιούλιο.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="508" y="60" width="264" height="50" rx="25" fill="#5727A3"/><text x="536" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="208" lengthAdjust="spacingAndGlyphs">ΜΠΛΕ ΤΙΜΟΛΟΓΙΑ</text><text x="291" y="245" font-size="127" font-weight="700" fill="#5727A3" textLength="698" lengthAdjust="spacingAndGlyphs">11,5 λεπτά</text><text x="277" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="726" lengthAdjust="spacingAndGlyphs">ανά κιλοβατώρα, το σταθερό τιμολόγιο της ΔΕΗ</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="361" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="158" lengthAdjust="spacingAndGlyphs">31,44%</text><text x="277" y="478" font-size="32" font-weight="800" fill="#111111" textLength="326" lengthAdjust="spacingAndGlyphs">Σταθερά τιμολόγια</text><text x="273" y="520" font-size="21" font-weight="400" fill="#4A4A46" textLength="334" lengthAdjust="spacingAndGlyphs">των οικιακών παροχών, Ιούλιος</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="735" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="211" lengthAdjust="spacingAndGlyphs">12 μήνες</text><text x="706" y="478" font-size="32" font-weight="800" fill="#111111" textLength="268" lengthAdjust="spacingAndGlyphs">Κλείδωμα τιμής</text><text x="708" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="264" lengthAdjust="spacingAndGlyphs">πάγιο 3,5 € τον μήνα</text><text x="442" y="600" font-size="30" font-weight="700" fill="#111111" textLength="396" lengthAdjust="spacingAndGlyphs">δεν είναι λύση για όλους</text>
</svg>
