<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Κάθετος Διάδρομος: χρήση 18%</title>
<desc id="d">Έκθεση Atlantic Council για τη χρήση της εξαγωγικής δυναμικότητας φυσικού αερίου της Ελλάδας.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="523" y="60" width="235" height="50" rx="25" fill="#5727A3"/><text x="550" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="179" lengthAdjust="spacingAndGlyphs">ΦΥΣΙΚΟ ΑΕΡΙΟ</text><text x="532" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="215" lengthAdjust="spacingAndGlyphs">18%</text><text x="310" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="660" lengthAdjust="spacingAndGlyphs">χρήση της δυνητικής εξαγωγικής δυναμικότητας</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="270" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="339" lengthAdjust="spacingAndGlyphs">1,17 δισ. κ.μ.</text><text x="270" y="478" font-size="30" font-weight="800" fill="#111111" textLength="340" lengthAdjust="spacingAndGlyphs">Εξαγωγές 9μήνου 2026</text><text x="344" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="192" lengthAdjust="spacingAndGlyphs">από 0,74 το 2025</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="731" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="218" lengthAdjust="spacingAndGlyphs">7-8 €/MWh</text><text x="670" y="478" font-size="31" font-weight="800" fill="#111111" textLength="340" lengthAdjust="spacingAndGlyphs">Κόστος έως Ουκρανία</text><text x="720" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="240" lengthAdjust="spacingAndGlyphs">εκτίμηση της έκθεσης</text><text x="408" y="600" font-size="30" font-weight="700" fill="#111111" textLength="465" lengthAdjust="spacingAndGlyphs">πηγή: energygame.gr, 17/11/2026</text>
