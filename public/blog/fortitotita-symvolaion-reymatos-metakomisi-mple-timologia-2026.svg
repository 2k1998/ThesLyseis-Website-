<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Σταθερό τιμολόγιο ρεύματος και μετακόμιση</title>
<desc id="d">Δεν υπάρχει ενιαία διαδικασία ώστε το συμβόλαιο να ακολουθεί τον καταναλωτή στη νέα διεύθυνση.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="575" y="60" width="130" height="50" rx="25" fill="#5727A3"/><text x="603" y="94" font-size="23" font-weight="700" fill="#FFFFFF" textLength="74" lengthAdjust="spacingAndGlyphs">ΡΕΥΜΑ</text><text x="280" y="245" font-size="119" font-weight="700" fill="#5727A3" textLength="720" lengthAdjust="spacingAndGlyphs">Μετακόμιση;</text><text x="318" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="645" lengthAdjust="spacingAndGlyphs">τι γίνεται με το σταθερό συμβόλαιο ρεύματος</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="307" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="266" lengthAdjust="spacingAndGlyphs">30,3 λ./kWh</text><text x="288" y="478" font-size="32" font-weight="800" fill="#111111" textLength="305" lengthAdjust="spacingAndGlyphs">Πράσινα Νοεμβρίου</text><text x="314" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="252" lengthAdjust="spacingAndGlyphs">από 23,5 τον Οκτώβριο</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="719" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="242" lengthAdjust="spacingAndGlyphs">~13 λ./kWh</text><text x="670" y="478" font-size="31" font-weight="800" fill="#111111" textLength="340" lengthAdjust="spacingAndGlyphs">Σταθερά προγράμματα</text><text x="720" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="240" lengthAdjust="spacingAndGlyphs">ενδεικτικά, με όρους</text><text x="408" y="600" font-size="30" font-weight="700" fill="#111111" textLength="465" lengthAdjust="spacingAndGlyphs">πηγή: energygame.gr, 16/11/2026</text>
</svg>
