<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Χονδρική τιμή ρεύματος 247,82 €/MWh την Τρίτη 20 Οκτωβρίου</title>
<desc id="d">Η μέση τιμή της Αγοράς Επόμενης Ημέρας ανέβηκε στα 247,82 ευρώ/MWh, από 180,78 την Κυριακή. Ο μέσος όρος του Οκτωβρίου είναι 172,94 έναντι 156,31 τον Σεπτέμβριο.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="449" y="60" width="383" height="50" rx="25" fill="#5727A3"/><text x="477" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="327" lengthAdjust="spacingAndGlyphs">ΧΟΝΔΡΙΚΗ ΤΙΜΗ ΡΕΥΜΑΤΟΣ</text><text x="354" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="572" lengthAdjust="spacingAndGlyphs">247,82 €</text><text x="360" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="561" lengthAdjust="spacingAndGlyphs">ανά MWh σήμερα, Τρίτη 20 Οκτωβρίου</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="335" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="211" lengthAdjust="spacingAndGlyphs">172,94 €</text><text x="296" y="478" font-size="32" font-weight="800" fill="#111111" textLength="288" lengthAdjust="spacingAndGlyphs">Μέσος όρος Οκτ.</text><text x="275" y="520" font-size="20" font-weight="400" fill="#4A4A46" textLength="330" lengthAdjust="spacingAndGlyphs">έναντι 156,31 € τον Σεπτέμβριο</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="788" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="105" lengthAdjust="spacingAndGlyphs">+37%</text><text x="716" y="478" font-size="32" font-weight="800" fill="#111111" textLength="249" lengthAdjust="spacingAndGlyphs">Σε δύο ημέρες</text><text x="673" y="520" font-size="19" font-weight="400" fill="#4A4A46" textLength="334" lengthAdjust="spacingAndGlyphs">180,78 € Κυριακή, 247,82 € Τρίτη</text><text x="294" y="600" font-size="28" font-weight="700" fill="#111111" textLength="693" lengthAdjust="spacingAndGlyphs">η χονδρική δεν περνά αυτόματα στον λογαριασμό</text>
</svg>
