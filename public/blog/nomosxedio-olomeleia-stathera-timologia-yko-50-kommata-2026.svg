<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Στην Ολομέλεια το νομοσχέδιο για την αγορά ρεύματος</title>
<desc id="d">Σταθερά τιμολόγια, προστασία από αποκοπές όσο εκκρεμεί ένσταση και μείωση 50% στις ΥΚΩ, όπως τα παρουσιάζει το ΥΠΕΝ.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="501" y="60" width="279" height="50" rx="25" fill="#5727A3"/><text x="528" y="94" font-size="23" font-weight="700" fill="#FFFFFF" textLength="223" lengthAdjust="spacingAndGlyphs">ΝΟΜΟΣΧΕΔΙΟ ΥΠΕΝ</text><text x="354" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="572" lengthAdjust="spacingAndGlyphs">−50% ΥΚΩ</text><text x="332" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="615" lengthAdjust="spacingAndGlyphs">στην πρώτη κλίμακα κατανάλωσης (οικιακοί)</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="356" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="169" lengthAdjust="spacingAndGlyphs">6 μήνες</text><text x="342" y="478" font-size="32" font-weight="800" fill="#111111" textLength="197" lengthAdjust="spacingAndGlyphs">Προμηθευτής</text><text x="270" y="520" font-size="23" font-weight="400" fill="#4A4A46" textLength="340" lengthAdjust="spacingAndGlyphs">τελευταίου καταφυγίου (από 3)</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="719" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="242" lengthAdjust="spacingAndGlyphs">2,3 δισ. €</text><text x="670" y="478" font-size="26" font-weight="800" fill="#111111" textLength="340" lengthAdjust="spacingAndGlyphs">Ταμείο Απανθρακοποίησης</text><text x="768" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="144" lengthAdjust="spacingAndGlyphs">για τα νησιά</text><text x="468" y="600" font-size="30" font-weight="700" fill="#111111" textLength="345" lengthAdjust="spacingAndGlyphs">δεν έχει ακόμη ψηφιστεί</text>
</svg>
