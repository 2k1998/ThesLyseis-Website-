<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">ΔΕΠΑ Εμπορίας: επιστροφή σε κερδοφορία το 2026 και επενδύσεις σε ΑΠΕ και μονάδες αερίου</title>
<desc id="d">Ο όμιλος περιέστειλε τις ζημιές του 2025 στα 50,34 εκατ. ευρώ και, σύμφωνα με πληροφορίες του energypress, αναμένεται κερδοφόρος το 2026.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="516" y="60" width="249" height="50" rx="25" fill="#5727A3"/><text x="544" y="94" font-size="23" font-weight="700" fill="#FFFFFF" textLength="193" lengthAdjust="spacingAndGlyphs">ΔΕΠΑ ΕΜΠΟΡΙΑΣ</text><text x="426" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="429" lengthAdjust="spacingAndGlyphs">−40,8%</text><text x="290" y="305" font-size="27" font-weight="400" fill="#4A4A46" textLength="700" lengthAdjust="spacingAndGlyphs">οι καθαρές ζημιές του 2025: 50,34 εκατ. € από 84,99</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="295" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="290" lengthAdjust="spacingAndGlyphs">1,684 δισ. €</text><text x="270" y="478" font-size="30" font-weight="800" fill="#111111" textLength="340" lengthAdjust="spacingAndGlyphs">Κύκλος εργασιών 2025</text><text x="302" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="276" lengthAdjust="spacingAndGlyphs">+16,8% από 1,441 δισ. €</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="768" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="145" lengthAdjust="spacingAndGlyphs">792 MW</text><text x="714" y="478" font-size="32" font-weight="800" fill="#111111" textLength="251" lengthAdjust="spacingAndGlyphs">Μονάδα Λάρισας</text><text x="670" y="520" font-size="21" font-weight="400" fill="#4A4A46" textLength="340" lengthAdjust="spacingAndGlyphs">απόφαση επένδυσης έως τέλος 2026</text><text x="250" y="600" font-size="26" font-weight="700" fill="#111111" textLength="780" lengthAdjust="spacingAndGlyphs">για το 2026 αναμένεται κερδοφορία, σύμφωνα με το energypress</text>
</svg>
