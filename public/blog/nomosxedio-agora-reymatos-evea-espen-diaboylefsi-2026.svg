<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="441" y="60" width="398" height="50" rx="25" fill="#5727A3"/><text x="469" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="342" lengthAdjust="spacingAndGlyphs">ΔΙΑΒΟΥΛΕΥΣΗ ΝΟΜΟΣΧΕΔΙΟΥ</text><text x="293" y="245" font-size="79" font-weight="700" fill="#5727A3" textLength="695" lengthAdjust="spacingAndGlyphs">Οδηγία 2024/1711</text><text x="302" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="676" lengthAdjust="spacingAndGlyphs">η ενσωμάτωση στην ελληνική αγορά ρεύματος</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="388" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="105" lengthAdjust="spacingAndGlyphs">ΕΒΕΑ</text><text x="325" y="478" font-size="32" font-weight="800" fill="#111111" textLength="230" lengthAdjust="spacingAndGlyphs">Επιχειρήσεις</text><text x="279" y="520" font-size="19" font-weight="400" fill="#4A4A46" textLength="323" lengthAdjust="spacingAndGlyphs">συνδέσεις, data centers, κόστος</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="774" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="132" lengthAdjust="spacingAndGlyphs">ΕΣΠΕΝ</text><text x="735" y="478" font-size="32" font-weight="800" fill="#111111" textLength="211" lengthAdjust="spacingAndGlyphs">Προμηθευτές</text><text x="677" y="520" font-size="18" font-weight="400" fill="#4A4A46" textLength="326" lengthAdjust="spacingAndGlyphs">αποσύνδεση, αντιστάθμιση κινδύνου</text><text x="442" y="600" font-size="30" font-weight="700" fill="#111111" textLength="396" lengthAdjust="spacingAndGlyphs">προτάσεις, όχι αποφάσεις</text>
