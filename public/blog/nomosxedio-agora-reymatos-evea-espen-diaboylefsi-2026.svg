<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Νομοσχέδιο αγοράς ρεύματος: τι ζητούν ΕΒΕΑ και ΕΣΠΕΝ</title>
<desc id="d">Το ΕΒΕΑ ζητά ταχύτερες συνδέσεις και χαμηλότερο κόστος για τις επιχειρήσεις. Ο ΕΣΠΕΝ τοποθετείται για την προστασία των καταναλωτών και τη διαχείριση κινδύνου των προμηθευτών.</desc>
