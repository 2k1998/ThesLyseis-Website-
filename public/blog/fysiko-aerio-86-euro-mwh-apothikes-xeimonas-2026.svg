<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Φυσικό αέριο στα 86 ευρώ ανά μεγαβατώρα και αποθήκες που αδειάζουν</title>
<desc id="d">Το ευρωπαϊκό αέριο TTF έφτασε τα 86 ευρώ ανά μεγαβατώρα, τριπλάσιο από την αρχή του έτους. Οι αποθήκες θα ξεκινήσουν τον Νοέμβριο στο 76-78% και ίσως κλείσουν τον χειμώνα στο 10-30%.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="517" y="60" width="246" height="50" rx="25" fill="#5727A3"/>
<text x="545" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="190" lengthAdjust="spacingAndGlyphs">ΦΥΣΙΚΟ ΑΕΡΙΟ</text><text x="318" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="644" lengthAdjust="spacingAndGlyphs">86 €/MWh</text><text x="464" y="305" font-size="32" font-weight="400" fill="#4A4A46" textLength="352" lengthAdjust="spacingAndGlyphs">TTF, υψηλό από το 2022</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="414" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="52" lengthAdjust="spacingAndGlyphs">×3</text><text x="311" y="478" font-size="32" font-weight="800" fill="#111111" textLength="259" lengthAdjust="spacingAndGlyphs">Τριπλάσια τιμή</text><text x="275" y="520" font-size="22" font-weight="400" fill="#4A4A46" textLength="330" lengthAdjust="spacingAndGlyphs">σε σχέση με την αρχή του έτους</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="761" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="158" lengthAdjust="spacingAndGlyphs">76–78%</text><text x="682" y="478" font-size="26" font-weight="800" fill="#111111" textLength="316" lengthAdjust="spacingAndGlyphs">Αποθήκες τον Νοέμβριο</text><text x="744" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="192" lengthAdjust="spacingAndGlyphs">εκτίμηση ENTSO-G</text><text x="321" y="600" font-size="30" font-weight="700" fill="#111111" textLength="638" lengthAdjust="spacingAndGlyphs">τέλος χειμώνα: 10–30% γεμάτες αποθήκες</text>
</svg>
