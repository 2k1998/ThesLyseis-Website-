<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">ΕΕ: ταχύτερες αδειοδοτήσεις σε δίκτυα και ΑΠΕ</title>
<desc id="d">Προσωρινή συμφωνία Συμβουλίου και Κοινοβουλίου για νέα Οδηγία αδειοδότησης.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="597" y="60" width="86" height="50" rx="25" fill="#5727A3"/><text x="625" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="30" lengthAdjust="spacingAndGlyphs">ΕΕ</text><text x="354" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="572" lengthAdjust="spacingAndGlyphs">Συμφωνία</text><text x="310" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="660" lengthAdjust="spacingAndGlyphs">προσωρινή, για αδειοδοτήσεις δικτύων και ΑΠΕ</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="343" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="194" lengthAdjust="spacingAndGlyphs">18 μήνες</text><text x="270" y="478" font-size="21" font-weight="800" fill="#111111" textLength="340" lengthAdjust="spacingAndGlyphs">Ενσωμάτωση στο εθνικό δίκαιο</text><text x="270" y="520" font-size="22" font-weight="400" fill="#4A4A46" textLength="340" lengthAdjust="spacingAndGlyphs">μετά τη δημοσίευση της Οδηγίας</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="792" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="97" lengthAdjust="spacingAndGlyphs">7 MW</text><text x="670" y="478" font-size="22" font-weight="800" fill="#111111" textLength="340" lengthAdjust="spacingAndGlyphs">Όριο για ανταποδοτικά οφέλη</text><text x="708" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="264" lengthAdjust="spacingAndGlyphs">έργα ΑΠΕ πάνω από 7 MW</text><text x="408" y="600" font-size="30" font-weight="700" fill="#111111" textLength="465" lengthAdjust="spacingAndGlyphs">πηγή: energygame.gr, 19/11/2026</text>
</svg>
