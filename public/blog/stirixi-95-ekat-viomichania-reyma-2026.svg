<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Στήριξη 95 εκατ. ευρώ για το ρεύμα της βιομηχανίας</title>
<desc id="d">Μείωση της τιμής του ρεύματος έως 50% από τον Ιανουάριο έως τον Ιούλιο και έως 70% από τον Αύγουστο έως τον Δεκέμβριο 2026, με κατώτατη τιμή 50 ευρώ ανά MWh.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="478" y="60" width="325" height="50" rx="25" fill="#5727A3"/><text x="506" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="269" lengthAdjust="spacingAndGlyphs">ΡΕΥΜΑ ΒΙΟΜΗΧΑΝΙΑΣ</text><text x="237" y="240" font-size="130" font-weight="700" fill="#5727A3" textLength="806" lengthAdjust="spacingAndGlyphs">95 εκατ. €</text><text x="312" y="300" font-size="32" font-weight="400" fill="#4A4A46" textLength="657" lengthAdjust="spacingAndGlyphs">στήριξη στην ελληνική βιομηχανία, 2026</text><rect x="260" y="350" width="360" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="282" y="430" font-size="64" font-weight="800" fill="#5727A3" textLength="317" lengthAdjust="spacingAndGlyphs">έως −50%</text><text x="286" y="480" font-size="26" font-weight="400" fill="#111111" textLength="309" lengthAdjust="spacingAndGlyphs">στην τιμή του ρεύματος</text><text x="270" y="520" font-size="26" font-weight="700" fill="#4A4A46" textLength="339" lengthAdjust="spacingAndGlyphs">Ιαν–Ιούλ 2026 (CISAF)</text><rect x="660" y="350" width="360" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="682" y="430" font-size="64" font-weight="800" fill="#5727A3" textLength="317" lengthAdjust="spacingAndGlyphs">έως −70%</text><text x="686" y="480" font-size="26" font-weight="400" fill="#111111" textLength="309" lengthAdjust="spacingAndGlyphs">στην τιμή του ρεύματος</text><text x="670" y="520" font-size="26" font-weight="700" fill="#4A4A46" textLength="339" lengthAdjust="spacingAndGlyphs">Αύγ–Δεκ 2026 (METSAF)</text><text x="356" y="610" font-size="34" font-weight="700" fill="#111111" textLength="569" lengthAdjust="spacingAndGlyphs">κατώτατη τιμή: 50 € ανά MWh</text>
</svg>
