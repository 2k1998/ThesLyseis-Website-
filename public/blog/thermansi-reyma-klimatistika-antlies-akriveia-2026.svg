<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Ακριβά καύσιμα: στροφή των νοικοκυριών στο ρεύμα για θέρμανση</title>
<desc id="d">Σύμφωνα με το ertnews, το φυσικό αέριο έχει αυξήσεις 55%, το ρεύμα 15% και το πετρέλαιο θέρμανσης είναι 38% ακριβότερο από πέρυσι. Κλιματιστικά και αντλίες θερμότητας αποδίδουν πολύ περισσότερο από τα απλά θερμαντικά σώματα.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="553" y="60" width="175" height="50" rx="25" fill="#5727A3"/><text x="581" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="119" lengthAdjust="spacingAndGlyphs">ΘΕΡΜΑΝΣΗ</text><text x="497" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="286" lengthAdjust="spacingAndGlyphs">+55%</text><text x="261" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="759" lengthAdjust="spacingAndGlyphs">αύξηση στο φυσικό αέριο, σύμφωνα με το ertnews</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="388" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="105" lengthAdjust="spacingAndGlyphs">+38%</text><text x="275" y="478" font-size="29" font-weight="800" fill="#111111" textLength="330" lengthAdjust="spacingAndGlyphs">Πετρέλαιο θέρμανσης</text><text x="302" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="277" lengthAdjust="spacingAndGlyphs">ακριβότερο από πέρυσι</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="788" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="105" lengthAdjust="spacingAndGlyphs">2–4×</text><text x="677" y="478" font-size="32" font-weight="800" fill="#111111" textLength="326" lengthAdjust="spacingAndGlyphs">Αντλία θερμότητας</text><text x="673" y="520" font-size="21" font-weight="400" fill="#4A4A46" textLength="334" lengthAdjust="spacingAndGlyphs">θερμικές kWh ανά kWh ρεύματος</text><text x="393" y="600" font-size="30" font-weight="700" fill="#111111" textLength="495" lengthAdjust="spacingAndGlyphs">δες πόσο αποδίδει κάθε συσκευή</text>
</svg>
