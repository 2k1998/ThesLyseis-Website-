<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Φυσικό αέριο: από τα 103 στα 84 και ξανά στα 90 €/MWh μέσα σε λίγες ημέρες</title>
<desc id="d">Η τιμή του αερίου ανέβηκε και έπεσε περίπου 30% σε λίγα εικοσιτετράωρα, ενώ τα futures για Ιανουάριο και Φεβρουάριο 2027 έκλεισαν πάνω από 89-90 €/MWh.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="523" y="60" width="235" height="50" rx="25" fill="#5727A3"/><text x="550" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="179" lengthAdjust="spacingAndGlyphs">ΦΥΣΙΚΟ ΑΕΡΙΟ</text><text x="354" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="572" lengthAdjust="spacingAndGlyphs">90 €/MWh</text><text x="302" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="675" lengthAdjust="spacingAndGlyphs">η τιμή του αερίου ξανά, μετά από 103 και 84 €</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="319" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="242" lengthAdjust="spacingAndGlyphs">103 → 84 €</text><text x="296" y="478" font-size="32" font-weight="800" fill="#111111" textLength="287" lengthAdjust="spacingAndGlyphs">Άνοδος και πτώση</text><text x="278" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="324" lengthAdjust="spacingAndGlyphs">≈30% σε λίγα εικοσιτετράωρα</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="731" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="218" lengthAdjust="spacingAndGlyphs">90 / 89 €</text><text x="670" y="478" font-size="27" font-weight="800" fill="#111111" textLength="340" lengthAdjust="spacingAndGlyphs">Futures Ιαν.–Φεβ. 2027</text><text x="678" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="324" lengthAdjust="spacingAndGlyphs">έκλεισαν χθες πάνω από αυτά</text><text x="385" y="600" font-size="30" font-weight="700" fill="#111111" textLength="510" lengthAdjust="spacingAndGlyphs">άποψη αναλυτών, όχι πρόβλεψη τιμών</text>
</svg>
