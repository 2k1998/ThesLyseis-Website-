<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Κοινή χρήση ενέργειας και net-billing στο νομοσχέδιο του ΥΠΕΝ</title>
<desc id="d">Όρια 10,8 kW για μεμονωμένες κατοικίες και 50 kW για πολυκατοικίες στην κοινή χρήση ενέργειας. Τα οικιακά φωτοβολταϊκά net-billing εξαιρούνται από τις επιβαρύνσεις των αρνητικών τιμών. Διαβούλευση έως 24 Οκτωβρίου.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="494" y="60" width="293" height="50" rx="25" fill="#5727A3"/>
<text x="522" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="237" lengthAdjust="spacingAndGlyphs">ΝΟΜΟΣΧΕΔΙΟ ΥΠΕΝ</text><text x="358" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="564" lengthAdjust="spacingAndGlyphs">10,8 kW</text><text x="360" y="305" font-size="32" font-weight="400" fill="#4A4A46" textLength="560" lengthAdjust="spacingAndGlyphs">όριο ισχύος για μεμονωμένη κατοικία</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="374" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="132" lengthAdjust="spacingAndGlyphs">50 kW</text><text x="320" y="478" font-size="32" font-weight="800" fill="#111111" textLength="241" lengthAdjust="spacingAndGlyphs">Πολυκατοικίες</text><text x="275" y="520" font-size="22" font-weight="400" fill="#4A4A46" textLength="330" lengthAdjust="spacingAndGlyphs">όριο για σχήματα κοινής χρήσης</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="801" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="79" lengthAdjust="spacingAndGlyphs">0 €</text><text x="701" y="478" font-size="32" font-weight="800" fill="#111111" textLength="278" lengthAdjust="spacingAndGlyphs">Αρνητικές τιμές</text><text x="675" y="520" font-size="22" font-weight="400" fill="#4A4A46" textLength="330" lengthAdjust="spacingAndGlyphs">δεν επιβαρύνουν το net-billing</text><text x="405" y="600" font-size="30" font-weight="700" fill="#111111" textLength="470" lengthAdjust="spacingAndGlyphs">διαβούλευση έως 24 Οκτωβρίου</text>
</svg>
