<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Ευέλικτα σταθερά τιμολόγια: η ΡΑΑΕΥ ζητά εξηγήσεις από τους προμηθευτές</title>
<desc id="d">Στα προϊόντα με κλίμακες κατανάλωσης, η υπέρβαση ορίου μπορεί να σημαίνει υψηλότερη τιμή από την πρώτη κιλοβατώρα. Για 300 kWh, παράδειγμα με 64,60 € έναντι 56,40 € για κλασικό σταθερό.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="426" y="60" width="428" height="50" rx="25" fill="#5727A3"/><text x="454" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="372" lengthAdjust="spacingAndGlyphs">ΡΑΑΕΥ · ΣΤΑΘΕΡΑ ΤΙΜΟΛΟΓΙΑ</text><text x="426" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="429" lengthAdjust="spacingAndGlyphs">31,44%</text><text x="262" y="305" font-size="26" font-weight="400" fill="#4A4A46" textLength="757" lengthAdjust="spacingAndGlyphs">των οικιακών παροχών είναι πλέον σε σταθερό τιμολόγιο</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="348" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="184" lengthAdjust="spacingAndGlyphs">64,60 €</text><text x="364" y="478" font-size="32" font-weight="800" fill="#111111" textLength="153" lengthAdjust="spacingAndGlyphs">Ευέλικτο</text><text x="275" y="520" font-size="20" font-weight="400" fill="#4A4A46" textLength="330" lengthAdjust="spacingAndGlyphs">300 kWh, κλίμακες 13,9–21,9 λ.</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="748" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="184" lengthAdjust="spacingAndGlyphs">56,40 €</text><text x="696" y="478" font-size="32" font-weight="800" fill="#111111" textLength="288" lengthAdjust="spacingAndGlyphs">Κλασικό σταθερό</text><text x="675" y="520" font-size="20" font-weight="400" fill="#4A4A46" textLength="330" lengthAdjust="spacingAndGlyphs">300 kWh, ενιαία χρέωση 14,5 λ.</text><text x="360" y="600" font-size="30" font-weight="700" fill="#111111" textLength="561" lengthAdjust="spacingAndGlyphs">διάβασε τους όρους πριν υπογράψεις</text>
</svg>
