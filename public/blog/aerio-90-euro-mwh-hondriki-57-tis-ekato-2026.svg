<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Φυσικό αέριο στα 90 €/MWh και άλμα 57% στη χονδρική ρεύματος από τον Ιούλιο</title>
<desc id="d">Το φυσικό αέριο άγγιξε τα 90 ευρώ/MWh για πρώτη φορά από τον Δεκέμβριο του 2022. Η χονδρική τιμή ρεύματος έχει ανέβει περίπου 57% από τον Ιούλιο, με μέσο όρο Οκτωβρίου 173 ευρώ/MWh.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="501" y="60" width="279" height="50" rx="25" fill="#5727A3"/><text x="529" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="223" lengthAdjust="spacingAndGlyphs">ΑΕΡΙΟ ΚΑΙ ΡΕΥΜΑ</text><text x="354" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="572" lengthAdjust="spacingAndGlyphs">90 €/MWh</text><text x="262" y="305" font-size="25" font-weight="400" fill="#4A4A46" textLength="756" lengthAdjust="spacingAndGlyphs">το αέριο (TTF) άγγιξε τα 90 € ενδοσυνεδριακά τη Δευτέρα</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="388" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="105" lengthAdjust="spacingAndGlyphs">+57%</text><text x="277" y="478" font-size="32" font-weight="800" fill="#111111" textLength="326" lengthAdjust="spacingAndGlyphs">Χονδρική ρεύματος</text><text x="273" y="520" font-size="19" font-weight="400" fill="#4A4A46" textLength="334" lengthAdjust="spacingAndGlyphs">από τον Ιούλιο, κατά το ρεπορτάζ</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="774" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="132" lengthAdjust="spacingAndGlyphs">173 €</text><text x="696" y="478" font-size="32" font-weight="800" fill="#111111" textLength="288" lengthAdjust="spacingAndGlyphs">Μέσος όρος Οκτ.</text><text x="715" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="250" lengthAdjust="spacingAndGlyphs">€/MWh μέχρι στιγμής</text><text x="327" y="600" font-size="30" font-weight="700" fill="#111111" textLength="627" lengthAdjust="spacingAndGlyphs">η χονδρική δεν είναι ο λογαριασμός σου</text>
</svg>
