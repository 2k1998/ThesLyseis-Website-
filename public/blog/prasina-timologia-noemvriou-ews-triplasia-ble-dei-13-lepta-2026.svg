<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Πράσινα τιμολόγια Νοεμβρίου: από 16,9 έως 39,90 λεπτά/kWh</title>
<desc id="d">Οι ακριβότερες πράσινες χρεώσεις πλησιάζουν το τριπλάσιο του δωδεκάμηνου σταθερού της ΔΕΗ, που είναι στα 13 λεπτά.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="486" y="60" width="309" height="50" rx="25" fill="#5727A3"/><text x="514" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="253" lengthAdjust="spacingAndGlyphs">ΠΡΑΣΙΝΑ ΤΙΜΟΛΟΓΙΑ</text><text x="497" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="286" lengthAdjust="spacingAndGlyphs">≈ x3</text><text x="290" y="305" font-size="29" font-weight="400" fill="#4A4A46" textLength="700" lengthAdjust="spacingAndGlyphs">οι ακριβότερες πράσινες έναντι του μπλε της ΔΕΗ</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="343" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="194" lengthAdjust="spacingAndGlyphs">13 λεπτά</text><text x="306" y="478" font-size="32" font-weight="800" fill="#111111" textLength="269" lengthAdjust="spacingAndGlyphs">Μπλε ΔΕΗ 12μηνο</text><text x="320" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="240" lengthAdjust="spacingAndGlyphs">σταθερή τιμή ανά kWh</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="695" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="290" lengthAdjust="spacingAndGlyphs">16,9 – 39,90</text><text x="678" y="478" font-size="32" font-weight="800" fill="#111111" textLength="323" lengthAdjust="spacingAndGlyphs">Πράσινα, Νοέμβριος</text><text x="762" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="156" lengthAdjust="spacingAndGlyphs">λεπτά ανά kWh</text><text x="272" y="600" font-size="30" font-weight="700" fill="#111111" textLength="735" lengthAdjust="spacingAndGlyphs">πηγές: ertnews.gr, FinanceNews.gr, toManifesto.gr</text>
</svg>
