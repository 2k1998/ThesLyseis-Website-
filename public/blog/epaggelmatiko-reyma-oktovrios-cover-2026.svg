<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Επαγγελματικό ρεύμα Οκτωβρίου: διαφορά έως 120% ανάμεσα στα προγράμματα</title>
<desc id="d">Για κατανάλωση 330 kWh τον μήνα, το κόστος κυμαίνεται από 63,67 έως 116,87 ευρώ στα πράσινα και από 58,45 έως 128,80 ευρώ στα μπλε επαγγελματικά τιμολόγια.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="462" y="60" width="356" height="50" rx="25" fill="#5727A3"/><text x="490" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="300" lengthAdjust="spacingAndGlyphs">ΕΠΑΓΓΕΛΜΑΤΙΚΟ ΡΕΥΜΑ</text><text x="318" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="644" lengthAdjust="spacingAndGlyphs">έως 120%</text><text x="263" y="305" font-size="26" font-weight="400" fill="#4A4A46" textLength="754" lengthAdjust="spacingAndGlyphs">διαφορά ανάμεσα στο φθηνότερο και στο ακριβότερο πρόγραμμα</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="272" y="425" font-size="40" font-weight="800" fill="#5727A3" textLength="336" lengthAdjust="spacingAndGlyphs">63,67–116,87 €</text><text x="376" y="478" font-size="32" font-weight="800" fill="#111111" textLength="129" lengthAdjust="spacingAndGlyphs">Πράσινα</text><text x="278" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="324" lengthAdjust="spacingAndGlyphs">κόστος για 330 kWh τον μήνα</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="672" y="425" font-size="40" font-weight="800" fill="#5727A3" textLength="336" lengthAdjust="spacingAndGlyphs">58,45–128,80 €</text><text x="803" y="478" font-size="32" font-weight="800" fill="#111111" textLength="74" lengthAdjust="spacingAndGlyphs">Μπλε</text><text x="678" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="324" lengthAdjust="spacingAndGlyphs">κόστος για 330 kWh τον μήνα</text><text x="304" y="600" font-size="30" font-weight="700" fill="#111111" textLength="672" lengthAdjust="spacingAndGlyphs">ίδια κατανάλωση, πολύ διαφορετικό κόστος</text>
</svg>
