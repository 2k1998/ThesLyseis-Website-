<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Κομισιόν: κόστος επάρκειας ρεύματος</title>
<desc id="d">Ο συντονισμός των μηχανισμών επάρκειας μειώνει τις ανάγκες νέας ισχύος.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="575" y="60" width="130" height="50" rx="25" fill="#5727A3"/><text x="603" y="94" font-size="23" font-weight="700" fill="#FFFFFF" textLength="74" lengthAdjust="spacingAndGlyphs">ΡΕΥΜΑ</text><text x="497" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="286" lengthAdjust="spacingAndGlyphs">-46%</text><text x="340" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="600" lengthAdjust="spacingAndGlyphs">ανάγκες νέας ισχύος: από 36,6 σε 19,8 GW</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="319" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="242" lengthAdjust="spacingAndGlyphs">6,9 δισ. €</text><text x="342" y="478" font-size="32" font-weight="800" fill="#111111" textLength="197" lengthAdjust="spacingAndGlyphs">Κόστος 2025</text><text x="290" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="300" lengthAdjust="spacingAndGlyphs">σε 8 χώρες, 76% σε ορυκτά</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="756" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="169" lengthAdjust="spacingAndGlyphs">199 TWh</text><text x="688" y="478" font-size="32" font-weight="800" fill="#111111" textLength="305" lengthAdjust="spacingAndGlyphs">Data centers 2035</text><text x="744" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="192" lengthAdjust="spacingAndGlyphs">4,5% της ζήτησης</text><text x="415" y="600" font-size="30" font-weight="700" fill="#111111" textLength="450" lengthAdjust="spacingAndGlyphs">πηγή: ienergeia.gr, 20/11/2026</text>
</svg>
