<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Τιμολόγια Νοεμβρίου: χονδρική 312,72 €/MWh, πράσινα έως +76%, μπλε ΔΕΗ στα 13 λεπτά</title>
<desc id="d">Η χονδρική έφτασε στα 312,72 €/MWh στις 2 Νοεμβρίου. Η ΔΕΗ ανεβάζει το πράσινο 6,2% στα 16,9 λεπτά, η Ήρων 76% στα 25,95 και το μπλε της ΔΕΗ πάει στα 13 λεπτά.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="471" y="60" width="339" height="50" rx="25" fill="#5727A3"/><text x="498" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="283" lengthAdjust="spacingAndGlyphs">ΤΙΜΟΛΟΓΙΑ ΝΟΕΜΒΡΙΟΥ</text><text x="354" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="572" lengthAdjust="spacingAndGlyphs">312,72 €</text><text x="362" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="555" lengthAdjust="spacingAndGlyphs">χονδρική ανά MWh, Δευτέρα 2 Νοεμβρίου</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="319" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="242" lengthAdjust="spacingAndGlyphs">16,9 λεπτά</text><text x="342" y="478" font-size="32" font-weight="800" fill="#111111" textLength="197" lengthAdjust="spacingAndGlyphs">ΔΕΗ πράσινο</text><text x="270" y="520" font-size="23" font-weight="400" fill="#4A4A46" textLength="340" lengthAdjust="spacingAndGlyphs">+6,2% από 15,913 τον Οκτώβριο</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="707" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="266" lengthAdjust="spacingAndGlyphs">25,95 λεπτά</text><text x="732" y="478" font-size="32" font-weight="800" fill="#111111" textLength="215" lengthAdjust="spacingAndGlyphs">ΗΡΩΝ πράσινο</text><text x="678" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="324" lengthAdjust="spacingAndGlyphs">+76% από 14,76 τον Οκτώβριο</text><text x="370" y="600" font-size="30" font-weight="700" fill="#111111" textLength="540" lengthAdjust="spacingAndGlyphs">μπλε ΔΕΗ myHome Online: 13 λεπτά/kWh</text>
</svg>
