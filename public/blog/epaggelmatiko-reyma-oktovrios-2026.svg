<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Επαγγελματικό ρεύμα Οκτωβρίου: κόστος για 330 kWh τον μήνα</title>
<desc id="d">Τα πράσινα προγράμματα κοστίζουν από 63,67 έως 116,87 ευρώ, δηλαδή το ακριβότερο είναι κατά 84% πιο ακριβό. Τα μπλε από 58,45 έως 128,80 ευρώ, δηλαδή κατά 120% πιο ακριβό.</desc>
<rect x="0.5" y="0.5" width="719" height="379" rx="16" fill="#FFFFFF" stroke="#D6C5F0"/>
<text x="40" y="44" font-size="20" font-weight="700" fill="#111111">Το ίδιο ρεύμα, πολύ διαφορετικό κόστος</text>
<text x="40" y="70" font-size="15" fill="#6B6B66">Μηνιαίο κόστος για κατανάλωση 330 kWh · φθηνότερο έως ακριβότερο</text>
<line x1="200" y1="105" x2="200" y2="300" stroke="#E3E3DE" stroke-width="1"/><text x="200" y="322" text-anchor="middle" font-size="14" fill="#6B6B66">60 €</text><line x1="320" y1="105" x2="320" y2="300" stroke="#E3E3DE" stroke-width="1"/><text x="320" y="322" text-anchor="middle" font-size="14" fill="#6B6B66">80 €</text><line x1="440" y1="105" x2="440" y2="300" stroke="#E3E3DE" stroke-width="1"/><text x="440" y="322" text-anchor="middle" font-size="14" fill="#6B6B66">100 €</text><line x1="560" y1="105" x2="560" y2="300" stroke="#E3E3DE" stroke-width="1"/><text x="560" y="322" text-anchor="middle" font-size="14" fill="#6B6B66">120 €</text><line x1="680" y1="105" x2="680" y2="300" stroke="#E3E3DE" stroke-width="1"/><text x="680" y="322" text-anchor="middle" font-size="14" fill="#6B6B66">140 €</text><text x="40" y="132" font-size="17" font-weight="700" fill="#111111">Πράσινο (μεταβλητό)</text><text x="680" y="132" text-anchor="end" font-size="17" font-weight="700" fill="#5727A3">διαφορά +84%</text><rect x="222.0" y="150" width="319.2" height="22" rx="4" fill="#5727A3"/><circle cx="222.0" cy="161" r="6" fill="#FFFFFF" stroke="#5727A3" stroke-width="2"/><circle cx="541.2" cy="161" r="6" fill="#FFFFFF" stroke="#5727A3" stroke-width="2"/><text x="208.0" y="167" text-anchor="end" font-size="15" font-weight="600" fill="#111111">63,67 €</text><text x="555.2" y="167" font-size="15" font-weight="600" fill="#111111">116,87 €</text><text x="40" y="232" font-size="17" font-weight="700" fill="#111111">Μπλε (σταθερό)</text><text x="680" y="232" text-anchor="end" font-size="17" font-weight="700" fill="#5727A3">διαφορά +120%</text><rect x="190.7" y="250" width="422.1" height="22" rx="4" fill="#5727A3"/><circle cx="190.7" cy="261" r="6" fill="#FFFFFF" stroke="#5727A3" stroke-width="2"/><circle cx="612.8" cy="261" r="6" fill="#FFFFFF" stroke="#5727A3" stroke-width="2"/><text x="176.7" y="267" text-anchor="end" font-size="15" font-weight="600" fill="#111111">58,45 €</text><text x="626.8"