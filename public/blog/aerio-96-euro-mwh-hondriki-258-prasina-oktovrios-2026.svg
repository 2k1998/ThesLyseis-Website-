<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Αέριο στα 96-97 €/MWh, χονδρική 258,52 € και πράσινα τιμολόγια +12%</title>
<desc id="d">Το TTF ξεπέρασε τα 96 ευρώ/MWh, η χονδρική ρεύματος έφτασε τα 258,52 ευρώ τη Δευτέρα 26/10 και τα πράσινα τιμολόγια Οκτωβρίου ήταν κατά μέσο όρο 12% ακριβότερα.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="501" y="60" width="279" height="50" rx="25" fill="#5727A3"/><text x="529" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="223" lengthAdjust="spacingAndGlyphs">ΑΕΡΙΟ ΚΑΙ ΡΕΥΜΑ</text><text x="293" y="245" font-size="115" font-weight="700" fill="#5727A3" textLength="695" lengthAdjust="spacingAndGlyphs">96-97 €/MWh</text><text x="327" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="627" lengthAdjust="spacingAndGlyphs">το αέριο (TTF) τη Δευτέρα 26 Οκτωβρίου</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="335" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="211" lengthAdjust="spacingAndGlyphs">258,52 €</text><text x="277" y="478" font-size="32" font-weight="800" fill="#111111" textLength="326" lengthAdjust="spacingAndGlyphs">Χονδρική ρεύματος</text><text x="289" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="303" lengthAdjust="spacingAndGlyphs">+13,45% από την Κυριακή</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="788" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="105" lengthAdjust="spacingAndGlyphs">+12%</text><text x="677" y="478" font-size="32" font-weight="800" fill="#111111" textLength="326" lengthAdjust="spacingAndGlyphs">Πράσινα Οκτωβρίου</text><text x="673" y="520" font-size="21" font-weight="400" fill="#4A4A46" textLength="334" lengthAdjust="spacingAndGlyphs">μέσος όρος έναντι Σεπτεμβρίου</text><text x="409" y="600" font-size="30" font-weight="700" fill="#111111" textLength="462" lengthAdjust="spacingAndGlyphs">τι σημαίνει για τον Νοέμβριο</text>
</svg>
