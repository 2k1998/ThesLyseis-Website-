<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Νομοσχέδιο ΥΠΕΝ στη Βουλή: −50% στη χρέωση ΥΚΩ, σταθερά συμβόλαια 12 μηνών, προστασία από διακοπές</title>
<desc id="d">Το νομοσχέδιο του ΥΠΕΝ για την αγορά ρεύματος βρίσκεται στη Βουλή από τις 3 Νοεμβρίου. Προβλέπει μείωση 50% στη χρέωση ΥΚΩ της πρώτης κλίμακας, σταθερά συμβόλαια τουλάχιστον 12 μηνών και προστασία από διακοπή ρεύματος σε διαφορές με τον προμηθευτή.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="501" y="60" width="279" height="50" rx="25" fill="#5727A3"/><text x="528" y="94" font-size="23" font-weight="700" fill="#FFFFFF" textLength="223" lengthAdjust="spacingAndGlyphs">ΝΟΜΟΣΧΕΔΙΟ ΥΠΕΝ</text><text x="497" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="286" lengthAdjust="spacingAndGlyphs">−50%</text><text x="290" y="305" font-size="28" font-weight="400" fill="#4A4A46" textLength="700" lengthAdjust="spacingAndGlyphs">χρέωση ΥΚΩ στην πρώτη κλίμακα οικιακής κατανάλωσης</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="343" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="194" lengthAdjust="spacingAndGlyphs">12 μήνες</text><text x="288" y="478" font-size="32" font-weight="800" fill="#111111" textLength="305" lengthAdjust="spacingAndGlyphs">Σταθερά συμβόλαια</text><text x="296" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="288" lengthAdjust="spacingAndGlyphs">χωρίς μονομερείς αλλαγές</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="682" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="315" lengthAdjust="spacingAndGlyphs">2 καταγγελίες</text><text x="670" y="478" font-size="28" font-weight="800" fill="#111111" textLength="340" lengthAdjust="spacingAndGlyphs">Προστασία από διακοπή</text><text x="702" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="276" lengthAdjust="spacingAndGlyphs">έως 90 ημέρες η καθεμία</text><text x="355" y="600" font-size="30" font-weight="700" fill="#111111" textLength="570" lengthAdjust="spacingAndGlyphs">συζητείται στη Βουλή, δεν ισχύει ακόμη</text>
</svg>
