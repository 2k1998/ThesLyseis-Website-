<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">ΕΣΠΕΝ: Συντελεστής Κανονικοποίησης</title>
<desc id="d">Οι προμηθευτές ζητούν αλλαγές στην εκκαθάριση της αγοράς.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="575" y="60" width="130" height="50" rx="25" fill="#5727A3"/><text x="603" y="94" font-size="23" font-weight="700" fill="#FFFFFF" textLength="74" lengthAdjust="spacingAndGlyphs">ΡΕΥΜΑ</text><text x="354" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="572" lengthAdjust="spacingAndGlyphs">3 χρόνια</text><text x="290" y="305" font-size="29" font-weight="400" fill="#4A4A46" textLength="700" lengthAdjust="spacingAndGlyphs">μετά την περίοδο αναφοράς η Οριστική Εκκαθάριση</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="307" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="266" lengthAdjust="spacingAndGlyphs">6 εβδομάδες</text><text x="270" y="478" font-size="30" font-weight="800" fill="#111111" textLength="340" lengthAdjust="spacingAndGlyphs">Δοκιμαστική περίοδος</text><text x="270" y="520" font-size="21" font-weight="400" fill="#4A4A46" textLength="340" lengthAdjust="spacingAndGlyphs">ο ΕΣΠΕΝ ζητά τουλάχιστον 1 έτος</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="756" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="169" lengthAdjust="spacingAndGlyphs">6 μήνες</text><text x="696" y="478" font-size="32" font-weight="800" fill="#111111" textLength="287" lengthAdjust="spacingAndGlyphs">Πρόσθετος κύκλος</text><text x="762" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="156" lengthAdjust="spacingAndGlyphs">πρόταση ΕΣΠΕΝ</text><text x="415" y="600" font-size="30" font-weight="700" fill="#111111" textLength="450" lengthAdjust="spacingAndGlyphs">πηγή: ienergeia.gr, 23/11/2026</text>
