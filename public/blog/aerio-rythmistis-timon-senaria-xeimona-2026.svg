<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Το φυσικό αέριο παραμένει ρυθμιστής των τιμών: σενάρια για τον χειμώνα</title>
<desc id="d">Σενάρια της Energy Aspects για το TTF: πάνω από 200 ευρώ/MWh σε πολύ κρύο χειμώνα, γύρω στα 135 με παρατεταμένους περιορισμούς και 79 με ήπιο χειμώνα και LNG από το Κατάρ.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="479" y="60" width="323" height="50" rx="25" fill="#5727A3"/><text x="507" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="267" lengthAdjust="spacingAndGlyphs">ΣΕΝΑΡΙΑ ΓΙΑ ΤΟ TTF</text><text x="426" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="429" lengthAdjust="spacingAndGlyphs">200+ €</text><text x="271" y="305" font-size="28" font-weight="400" fill="#4A4A46" textLength="739" lengthAdjust="spacingAndGlyphs">σενάριο TTF σε πολύ κρύο χειμώνα, Energy Aspects</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="374" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="132" lengthAdjust="spacingAndGlyphs">135 €</text><text x="306" y="478" font-size="32" font-weight="800" fill="#111111" textLength="268" lengthAdjust="spacingAndGlyphs">Ήπιος χειμώνας</text><text x="275" y="520" font-size="20" font-weight="400" fill="#4A4A46" textLength="330" lengthAdjust="spacingAndGlyphs">αλλά παρατεταμένοι περιορισμοί</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="788" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="105" lengthAdjust="spacingAndGlyphs">79 €</text><text x="706" y="478" font-size="32" font-weight="800" fill="#111111" textLength="268" lengthAdjust="spacingAndGlyphs">Ήπιος χειμώνας</text><text x="708" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="264" lengthAdjust="spacingAndGlyphs">και LNG από το Κατάρ</text><text x="451" y="600" font-size="30" font-weight="700" fill="#111111" textLength="379" lengthAdjust="spacingAndGlyphs">σενάρια, όχι προβλέψεις</text>
</svg>
