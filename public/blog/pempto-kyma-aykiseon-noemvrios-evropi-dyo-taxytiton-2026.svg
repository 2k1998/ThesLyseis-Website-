<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Πέμπτο κύμα αυξήσεων στο ρεύμα τον Νοέμβριο και αγορά δύο ταχυτήτων</title>
<desc id="d">Το euro2day εκτιμά ότι η μέση τιμή των πράσινων τιμολογίων τον Νοέμβριο θα φτάσει τα 23,5 λεπτά/kWh. Η χονδρική στην Ελλάδα είναι 224 ευρώ/MWh, έναντι 6,53 στη Σουηδία.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="479" y="60" width="323" height="50" rx="25" fill="#5727A3"/><text x="507" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="267" lengthAdjust="spacingAndGlyphs">ΑΥΞΗΣΕΙΣ ΝΟΕΜΒΡΙΟΥ</text><text x="291" y="245" font-size="127" font-weight="700" fill="#5727A3" textLength="698" lengthAdjust="spacingAndGlyphs">23,5 λεπτά</text><text x="262" y="305" font-size="27" font-weight="400" fill="#4A4A46" textLength="757" lengthAdjust="spacingAndGlyphs">εκτίμηση για τη μέση τιμή των πράσινων τον Νοέμβριο</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="374" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="132" lengthAdjust="spacingAndGlyphs">224 €</text><text x="296" y="478" font-size="32" font-weight="800" fill="#111111" textLength="288" lengthAdjust="spacingAndGlyphs">Χονδρική Ελλάδα</text><text x="308" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="264" lengthAdjust="spacingAndGlyphs">Τρίτη 27/10, ανά MWh</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="761" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="158" lengthAdjust="spacingAndGlyphs">6,53 €</text><text x="716" y="478" font-size="32" font-weight="800" fill="#111111" textLength="249" lengthAdjust="spacingAndGlyphs">Σουηδία (SE2)</text><text x="689" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="303" lengthAdjust="spacingAndGlyphs">και 234 € στην Ουγγαρία</text><text x="484" y="600" font-size="30" font-weight="700" fill="#111111" textLength="313" lengthAdjust="spacingAndGlyphs">αγορά δύο ταχυτήτων</text>
</svg>
