<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">ΑΔΜΗΕ: οι ΑΠΕ πάνω από 56% της ηλεκτροπαραγωγής τον Σεπτέμβριο, οι μπαταρίες ανεβαίνουν</title>
<desc id="d">Σύμφωνα με στοιχεία του ΑΔΜΗΕ, οι ΑΠΕ έφτασαν περίπου 56,5% τον Σεπτέμβριο και οι μπαταρίες έδωσαν στο δίκτυο 47,9 GWh, ενώ η χονδρική ανέβηκε στα 197 € τον Οκτώβριο.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="508" y="60" width="264" height="50" rx="25" fill="#5727A3"/><text x="536" y="94" font-size="23" font-weight="700" fill="#FFFFFF" textLength="208" lengthAdjust="spacingAndGlyphs">ΣΤΟΙΧΕΙΑ ΑΔΜΗΕ</text><text x="461" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="358" lengthAdjust="spacingAndGlyphs">56,5%</text><text x="362" y="305" font-size="30" font-weight="400" fill="#4A4A46" textLength="555" lengthAdjust="spacingAndGlyphs">ΑΠΕ στην ηλεκτροπαραγωγή, Σεπτέμβριος</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="380" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="121" lengthAdjust="spacingAndGlyphs">197 €</text><text x="278" y="478" font-size="32" font-weight="800" fill="#111111" textLength="323" lengthAdjust="spacingAndGlyphs">Χονδρική Οκτωβρίου</text><text x="270" y="520" font-size="23" font-weight="400" fill="#4A4A46" textLength="340" lengthAdjust="spacingAndGlyphs">+26% από 156 € τον Σεπτέμβριο</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="743" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="194" lengthAdjust="spacingAndGlyphs">47,9 GWh</text><text x="696" y="478" font-size="32" font-weight="800" fill="#111111" textLength="287" lengthAdjust="spacingAndGlyphs">Έγχυση μπαταριών</text><text x="696" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="288" lengthAdjust="spacingAndGlyphs">από 2,91 GWh τον Απρίλιο</text><text x="250" y="600" font-size="28" font-weight="700" fill="#111111" textLength="780" lengthAdjust="spacingAndGlyphs">τα στοιχεία του ΑΔΜΗΕ, όπως τα παρουσιάζει το energymag</text>
</svg>
