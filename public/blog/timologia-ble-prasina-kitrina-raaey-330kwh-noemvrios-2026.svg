<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Τιμολόγια ρεύματος 2026: πώς τα μπλε προστάτευσαν τους λογαριασμούς το φθινόπωρο</title>
<desc id="d">Με βάση το εργαλείο στατιστικής της ΡΑΑΕΥ, τα μπλε τιμολόγια ήταν τον Νοέμβριο 41,3% φθηνότερα από τα πράσινα και 35,6% από τα κίτρινα, για κατανάλωση 330 kWh.</desc>
<rect width="1280" height="720" fill="#F4EEFC"/>
<circle cx="1180" cy="90" r="270" fill="#D6C5F0" opacity="0.55"/>
<circle cx="80" cy="690" r="210" fill="#D6C5F0" opacity="0.45"/>
<rect x="471" y="60" width="339" height="50" rx="25" fill="#5727A3"/><text x="498" y="94" font-size="24" font-weight="700" fill="#FFFFFF" textLength="283" lengthAdjust="spacingAndGlyphs">ΣΥΓΚΡΙΣΗ ΤΙΜΟΛΟΓΙΩΝ</text><text x="426" y="245" font-size="130" font-weight="700" fill="#5727A3" textLength="429" lengthAdjust="spacingAndGlyphs">−41,3%</text><text x="290" y="305" font-size="28" font-weight="400" fill="#4A4A46" textLength="700" lengthAdjust="spacingAndGlyphs">μπλε έναντι πράσινων τον Νοέμβριο (ΡΑΑΕΥ, 330 kWh)</text><rect x="250" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="356" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="169" lengthAdjust="spacingAndGlyphs">65,26 €</text><text x="306" y="478" font-size="32" font-weight="800" fill="#111111" textLength="269" lengthAdjust="spacingAndGlyphs">Μπλε, Νοέμβριος</text><text x="296" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="288" lengthAdjust="spacingAndGlyphs">+21,6% από τον Ιανουάριο</text><rect x="650" y="350" width="380" height="190" rx="24" fill="#FFFFFF" stroke="#D6C5F0" stroke-width="3"/><text x="743" y="425" font-size="44" font-weight="800" fill="#5727A3" textLength="194" lengthAdjust="spacingAndGlyphs">111,13 €</text><text x="678" y="478" font-size="32" font-weight="800" fill="#111111" textLength="323" lengthAdjust="spacingAndGlyphs">Πράσινα, Νοέμβριος</text><text x="696" y="520" font-size="24" font-weight="400" fill="#4A4A46" textLength="288" lengthAdjust="spacingAndGlyphs">+68,6% από τον Ιανουάριο</text><text x="378" y="600" font-size="30" font-weight="700" fill="#111111" textLength="525" lengthAdjust="spacingAndGlyphs">μέση μηνιαία επιβάρυνση για 330 kWh</text>
</svg>
